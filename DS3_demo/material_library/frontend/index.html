<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DS3 — Deep Spectral Signature System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@3.0.5/dist-browser/geotiff.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.3/umd/index.js"></script>
<style>
  :root{
    --bg:#020617;
    --panel:#0f172a;
    --panel2:#1e293b;
    --panel3:#0b1220;
    --border:#1e293b;
    --border2:#334155;
    --text:#e2e8f0;
    --muted:#64748b;
    --muted2:#94a3b8;
    --emerald:#10b981; --emerald-l:#34d399; --emerald-d:#022c22;
    --blue:#3b82f6; --blue-l:#60a5fa; --blue-d:#03163a;
    --violet:#8b5cf6; --violet-l:#a78bfa; --violet-d:#180a35;
    --amber:#f59e0b; --amber-l:#fbbf24; --amber-d:#2b1a02;
    --sky:#0ea5e9; --sky-l:#38bdf8; --sky-d:#03202e;
    --purple:#a855f7; --purple-l:#c084fc; --purple-d:#1c0a2e;
    --orange:#fb923c; --orange-l:#fdba74; --orange-d:#2b1404;
    --pink:#f472b6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .shell{
    max-width:1180px; margin:20px auto; background:var(--panel);
    border:1px solid var(--border); border-radius:14px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    display:flex; flex-direction:column; min-height:720px;
  }
  /* ---- title bar ---- */
  .titlebar{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--border);
    font-size:12px; color:var(--muted2); user-select:none;
  }
  .titlebar .left{ display:flex; align-items:center; gap:16px; }
  .brand{ display:flex; align-items:center; gap:8px; color:#e2e8f0; font-weight:600;}
  .brand svg{ color:var(--violet-l);}
  .menus{ display:flex; gap:12px; color:var(--muted);}
  .dots{ display:flex; gap:10px; color:var(--muted);}

  /* ---- layout ---- */
  .body-row{ display:flex; flex:1; min-height:0; }
  .sidebar{
    width:210px; flex-shrink:0; border-right:1px solid var(--border);
    background:rgba(15,23,42,.6); padding:12px; overflow-y:auto;
  }
  .sidebar .logo{
    display:flex; align-items:center; gap:8px; padding:6px 8px; margin-bottom:10px;
    border-radius:10px; cursor:pointer;
  }
  .sidebar .logo:hover{ background:rgba(30,41,59,.6);}
  .logo .mark{
    width:26px; height:26px; border-radius:8px; background:var(--violet);
    display:flex; align-items:center; justify-content:center; color:white;
  }
  .logo .name{ font-weight:700; font-size:14px; color:#f1f5f9;}
  .sec-label{ font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:0 8px; margin:14px 0 6px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px;
    font-size:13px; color:var(--muted2); cursor:pointer; margin-bottom:2px; border:none; background:none; width:100%; text-align:left;
  }
  .nav-item:hover{ background:rgba(30,41,59,.6); color:#e2e8f0;}
  .nav-item.active{ background:var(--panel2); color:#f1f5f9;}
  .nav-item .chip{ width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .chip.emerald{ background:var(--emerald-d); color:var(--emerald-l); border:1px solid #064e3b;}
  .chip.blue{ background:var(--blue-d); color:var(--blue-l); border:1px solid #1e3a8a;}
  .chip.violet{ background:var(--violet-d); color:var(--violet-l); border:1px solid #4c1d95;}
  .chip.amber{ background:var(--amber-d); color:var(--amber-l); border:1px solid #78350f;}

  .recent-item{
    display:flex; gap:8px; padding:6px 8px; border-radius:8px; cursor:pointer; text-align:left; border:none; background:none; width:100%;
  }
  .recent-item:hover{ background:rgba(30,41,59,.6);}
  .recent-item svg{ color:var(--muted); flex-shrink:0; margin-top:2px;}
  .recent-item .rname{ display:block; font-size:12px; color:#cbd5e1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .recent-item .rmeta{ display:block; font-size:10.5px; color:var(--muted);}

  .status-dot{ margin-top:auto; padding-top:10px; display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);}
  .status-dot .d{ width:6px; height:6px; border-radius:50%; background:var(--emerald);}

  main{ flex:1; min-width:0; overflow-y:auto; padding:22px 26px;}
  .statusbar{ padding:6px 16px; border-top:1px solid var(--border); font-size:11px; color:#334155; background:var(--panel);}

  h1.pagetitle{ font-size:19px; font-weight:600; color:#f1f5f9; margin:0 0 4px;}
  p.pagesub{ font-size:13px; color:var(--muted2); margin:0 0 20px; max-width:640px;}

  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--panel2); border:1px solid var(--border2);
    color:#f1f5f9; font-size:13px; padding:10px 16px; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.4);
    z-index:50; opacity:0; transform:translateY(8px); transition:.25s;
  }
  .toast.show{ opacity:1; transform:translateY(0);}

  /* ---- reusable bits ---- */
  .grid{ display:grid; gap:12px; }
  .cols-4{ grid-template-columns:repeat(4,1fr); }
  .cols-3{ grid-template-columns:repeat(3,1fr); }
  .cols-2{ grid-template-columns:repeat(2,1fr); }
  @media(max-width:800px){ .cols-4{grid-template-columns:repeat(2,1fr);} .cols-3{grid-template-columns:1fr;} .cols-2{grid-template-columns:1fr;} }

  .stat-card{ background:rgba(30,41,59,.5); border:1px solid var(--border); border-radius:10px; padding:10px 12px;}
  .stat-card .v{ font-size:18px; font-weight:700; color:#f1f5f9;}
  .stat-card .l{ font-size:12px; color:var(--muted);}

  .module-card{ background:rgba(30,41,59,.4); border:1px solid var(--border); border-radius:12px; padding:16px; display:flex; flex-direction:column;}
  .module-card .chip{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; margin-bottom:10px;}
  .module-card h3{ margin:0 0 4px; font-size:14px; color:#f1f5f9; font-weight:600;}
  .module-card p{ margin:0; font-size:13px; color:var(--muted2); flex:1;}
  .btn{ border:none; cursor:pointer; border-radius:9px; font-size:13px; padding:7px 13px; color:white; }
  .btn.emerald{ background:var(--emerald);} .btn.emerald:hover{ opacity:.9;}
  .btn.blue{ background:#2563eb;} .btn.blue:hover{ opacity:.9;}
  .btn.violet{ background:#7c3aed;} .btn.violet:hover{ opacity:.9;}
  .btn.ghost{ background:var(--panel2); color:#e2e8f0;} .btn.ghost:hover{ background:#334155;}
  .btn:disabled{ opacity:.45; cursor:not-allowed;}
  .btn-sm{ font-size:12px; padding:6px 10px; display:inline-flex; align-items:center; gap:6px;}

  .file-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 12px; border-bottom:1px solid var(--border); cursor:pointer; font-size:13px;}
  .file-row:last-child{ border-bottom:none;}
  .file-row:hover{ background:rgba(30,41,59,.4);}
  .file-row .fname{ color:#cbd5e1;}
  .file-row .fmeta{ color:var(--muted); font-size:11.5px;}
  .panel-list{ border:1px solid var(--border); border-radius:10px; overflow:hidden;}

  input[type=text], select{
    background:var(--panel3); border:1px solid var(--border2); border-radius:8px; color:#e2e8f0;
    padding:7px 10px; font-size:13px;
  }
  label.small{ font-size:11px; color:var(--muted); display:block; margin-bottom:4px;}

  .lib-card{ background:rgba(30,41,59,.4); border:1px solid var(--border); border-radius:12px; padding:14px; cursor:pointer;}
  .lib-card:hover{ border-color:var(--border2);}
  .lib-chip{ display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:999px; margin-bottom:8px;}
  .lib-card h4{ margin:0 0 3px; font-size:14px; color:#f1f5f9;}
  .lib-card .meta{ font-size:12px; color:var(--muted);}

  .mat-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; cursor:pointer;}
  .mat-row:hover{ background:rgba(30,41,59,.4);}
  .mat-row:last-child{ border-bottom:none;}
  .mat-tag{ font-size:10.5px; color:var(--muted); padding:2px 8px; border:1px solid var(--border2); border-radius:999px;}

  .crumb{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); margin-bottom:14px; cursor:pointer; width:fit-content;}
  .crumb:hover{ color:#e2e8f0;}

  .chart-wrap{ background:var(--panel3); border:1px solid var(--border); border-radius:10px; padding:12px;}
  .chart-axis{ stroke:#334155; }
  .chart-grid{ stroke:#1e293b; stroke-dasharray:3 3;}
  .chart-tick{ fill:#64748b; font-size:9px;}
  .banner-info{
    font-size:12px; color:#fbbf24; background:rgba(69,26,3,.4); border:1px solid rgba(146,64,14,.5);
    border-radius:8px; padding:9px 12px; margin-bottom:16px; display:flex; gap:8px;
  }
  .checkline{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted2);}
  .compare-chip{ display:inline-flex; align-items:center; gap:6px; font-size:12px; background:var(--panel2); padding:4px 10px; border-radius:999px; margin:3px 6px 0 0;}
  .compare-chip button{ background:none; border:none; color:var(--muted); cursor:pointer;}
  .compare-chip button:hover{ color:#f87171;}

  canvas#imgCanvas{ width:100%; border-radius:10px; border:1px solid var(--border); cursor:crosshair; display:block;}
  .placeholder-card{
    background:rgba(30,41,59,.25); border:1px dashed var(--border); border-radius:12px; padding:16px;
    color:var(--muted); text-align:center;
  }
  .arch-legend{ display:flex; gap:22px; font-size:12px; color:var(--muted2); margin-top:14px; flex-wrap:wrap;}
  .arch-legend .li{ display:flex; align-items:center; gap:7px;}
  .arch-legend .swatch{ width:22px; height:2px; }
  .arch-legend .swatch.dashed{ background:repeating-linear-gradient(90deg,#64748b 0 6px,transparent 6px 10px);}
  .arch-legend .swatch.solid{ background:#34d399;}
  .arch-note{ font-size:12.5px; color:var(--muted2); margin-top:14px; max-width:680px; line-height:1.5;}

  .add-form{
    display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap;
    background:rgba(30,41,59,.5); border:1px solid var(--border); border-radius:10px; padding:12px; margin:0 0 16px;
  }
  .add-form input[type=text]{ width:190px; }
  .search-row{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px; }
  .search-row input[type=text]{ width:230px; }
  .img-toolbar{ display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .img-toolbar select{ padding:5px 8px; font-size:12px; }
  .zoom-readout{ font-size:11.5px; color:var(--muted); min-width:38px; text-align:center; }
  .pixel-history{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .pixel-history .lbl{ font-size:11px; color:var(--muted); width:100%; margin-bottom:2px; }

  .georef-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:800px){ .georef-grid{ grid-template-columns:1fr; } }
  #geoMapDiv{ height:340px; border-radius:10px; border:1px solid var(--border); background:#0b1220; }
  #geoImgCanvas{ width:100%; height:340px; object-fit:contain; border-radius:10px; border:1px solid var(--border); cursor:crosshair; background:#0b1220; }
  .gcp-table{ width:100%; border-collapse:collapse; font-size:12px; margin-top:12px; }
  .gcp-table th{ text-align:left; color:var(--muted); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--border); }
  .gcp-table td{ padding:6px 8px; border-bottom:1px solid var(--border); color:#cbd5e1; }
  .gcp-table .bad{ color:#fbbf24; }
  .leaflet-container{ font-family:inherit; }
  .note{ font-size:12px; color:var(--muted2); margin:6px 0 0; }
.lfmenu{position:relative;display:inline-block}
.lfmenu-pop{display:none;position:absolute;top:100%;left:0;min-width:230px;z-index:50;background:var(--card,#1a1d2e);border:1px solid var(--border,#333);border-radius:8px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.lfmenu::after{content:"";position:absolute;left:0;right:0;top:100%;height:8px}
.lfmenu:hover .lfmenu-pop{display:block}
.lfmenu-pop a{display:block;padding:8px 12px;font-size:13px;cursor:pointer;border-radius:6px;color:inherit}
.lfmenu-pop a:hover{background:rgba(124,92,255,.25)}
.lfsub{position:relative}
.lfsub>a{display:flex;justify-content:space-between;gap:16px}
.lfsub-pop{left:100%;top:0;margin-left:2px}
.lfsub:hover>.lfsub-pop{display:block}
.lfsub::after{content:"";position:absolute;top:0;bottom:0;left:100%;width:6px}
.menus .mnu{position:relative;cursor:default;padding-bottom:6px;margin-bottom:-6px}
.menus .mnu:hover{color:#e2e8f0}
.mnu-pop{display:none;position:absolute;top:100%;left:0;min-width:210px;z-index:200;background:#1a1d2e;border:1px solid var(--border);border-radius:8px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.5);color:#e2e8f0;font-size:13px}
.mnu:hover>.mnu-pop{display:block}
.mnu-item{position:relative;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:6px}
.mnu-item:hover{background:rgba(124,92,255,.25)}
.mnu-item i{font-style:normal;margin-left:14px}
.mnu-item:hover>.mnu-sub{display:block}
.mnu-sub{top:-5px;left:100%;min-width:230px}
.mnu-pop a{display:block;padding:8px 12px;border-radius:6px;cursor:pointer;color:inherit;white-space:nowrap}
.mnu-pop a:hover{background:rgba(124,92,255,.25)}
.lf-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center}
.lf-dialog{background:#1a1d2e;border:1px solid var(--border);border-radius:10px;padding:16px;min-width:340px;max-width:640px;width:92%;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lf-title{font-weight:600;margin-bottom:10px}.lf-cap{font-size:12px;color:var(--muted);margin-bottom:4px}
.lf-box{border:1px solid var(--border);border-radius:8px;padding:10px 12px}.lf-radio{display:block;padding:3px 0;font-size:13.5px}
.lf-btns{display:flex;gap:8px;margin-top:12px}.lf-row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.lf-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lf-list{border:1px solid var(--border);border-radius:8px;height:200px;overflow:auto}.lf-item{padding:5px 8px;font-size:13px;cursor:pointer}
.lf-item:hover{background:rgba(124,92,255,.15)}.lf-item.sel{background:rgba(124,92,255,.35)}
.lf-info{border:1px solid var(--border);border-radius:8px;height:200px;overflow:auto;padding:8px;font-size:12.5px;line-height:1.6}
.lf-menu{position:absolute;left:230px;top:34px;background:#232740;border:1px solid var(--border);border-radius:8px;padding:4px;min-width:190px;z-index:5}
.lf-mi{padding:6px 12px;font-size:13px;cursor:pointer;border-radius:6px}.lf-mi:hover{background:rgba(124,92,255,.25)}.lf-mi.off{opacity:.4;cursor:not-allowed}
.lf-sub{position:absolute;left:100%;top:0;background:#232740;border:1px solid var(--border);border-radius:8px;padding:4px;min-width:160px}
.lf-menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.acq-chip{font-size:10px;padding:1px 6px;border-radius:9px;border:1px solid var(--border)}
.acq-lab{color:#34d399;border-color:#34d399}.acq-field{color:#fbbf24;border-color:#fbbf24}.acq-airborne{color:#60a5fa;border-color:#60a5fa}.acq-satellite{color:#f472b6;border-color:#f472b6}
</style>
<style id="ui2css">
/* ===== UI v2: light, full-screen, ENVI-style shell ===== */
:root{
  --bg:#e8ecf1; --panel:#ffffff; --panel2:#eef1f5; --panel3:#ffffff;
  --border:#cdd4de; --border2:#b4bfcd; --text:#1b2430; --muted:#6b7684; --muted2:#4a5563;
  --emerald:#059669; --emerald-l:#047857; --emerald-d:#d1fae5;
  --blue:#2563eb; --blue-l:#1d4ed8; --blue-d:#dbeafe;
  --violet:#6d4fd8; --violet-l:#5b3fc4; --violet-d:#ede9fe;
  --amber:#d97706; --amber-l:#b45309; --amber-d:#fef3c7;
  --accent:#1f5fae;
  --sky:#0284c7; --sky-l:#075985; --sky-d:#e0f2fe; --purple:#9333ea; --purple-l:#7e22ce; --purple-d:#f3e8ff;
  --orange:#ea580c; --orange-l:#c2410c; --orange-d:#ffedd5; --pink:#db2777;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);overflow:hidden;font-size:13.5px}
.shell{max-width:none;margin:0;height:100vh;min-height:0;border:0;border-radius:0;box-shadow:none;background:var(--panel)}
.body-row{flex:1;min-height:0}
main{background:var(--bg);padding:18px 24px}

/* menu bar (ENVI Classic look) */
.menubar{display:flex;align-items:stretch;gap:0;background:#f4f5f7;border-bottom:1px solid var(--border2);font-size:13px;user-select:none;padding:0 4px;position:relative;z-index:300}
.menubar .mnu{position:relative;padding:6px 12px;color:#1b2430;cursor:default}
.menubar .mnu:hover,.menubar .mnu.open{background:#dbe6f4}
.menubar .mnu>.mnu-pop{top:100%;left:0}
.menubar .grow{flex:1}
.menubar .dbinfo{align-self:center;color:var(--muted);font-size:11.5px;padding:0 10px}
.mnu-pop{display:none;position:absolute;min-width:250px;z-index:400;background:#fbfcfd;border:1px solid var(--border2);border-radius:0 0 6px 6px;padding:3px 0;box-shadow:0 8px 22px rgba(20,30,50,.22);color:#1b2430;font-size:13px}
.mnu:hover>.mnu-pop,.mnu.open>.mnu-pop{display:block}
.menubar.shut .mnu-pop{display:none!important}
.mnu-item{position:relative;display:flex;justify-content:space-between;align-items:center;gap:26px;padding:6px 16px;border-radius:0;cursor:default;white-space:nowrap}
.mnu-item:hover{background:#cfe0f5}
.mnu-item .key{color:#8a94a3;font-size:11.5px}
.mnu-item i{font-style:normal;color:#5a6575}
.mnu-item.off{color:#a0a8b4;pointer-events:none}
.mnu-item.sub:hover>.mnu-pop{display:block}
.mnu-item>.mnu-pop{top:-4px;left:100%;border-radius:6px}
.mnu-sep{border-top:1px solid #d9dfe7;margin:3px 0}
.mnu-head{padding:4px 16px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:#8a94a3}

/* sidebar */
.sidebar{width:186px;background:#f4f5f7;border-right:1px solid var(--border2);padding:10px}
.sidebar .logo:hover{background:#e3e9f1}
.logo .name{color:#0f2744;font-size:15px}
.logo .mark{background:var(--accent)}
.sec-label{color:#7b8696}
.nav-item{color:#364152}
.nav-item:hover{background:#e3e9f1;color:#0f2744}
.nav-item.active{background:#d6e4f6;color:#0f2744;font-weight:600}
.chip.emerald{border-color:#a7f3d0}.chip.blue{border-color:#bfdbfe}.chip.violet{border-color:#ddd6fe}.chip.amber{border-color:#fde68a}
.statusbar{background:#f4f5f7;color:#5a6575;border-top:1px solid var(--border2)}
.status-dot{color:#5a6575}

h1.pagetitle{color:#0f2744}
p.pagesub{color:var(--muted2)}
.stat-card,.module-card,.lib-card,.add-form{background:#fff;border-color:var(--border)}
.stat-card .v,.module-card h3,.lib-card h4{color:#0f2744}
.module-card p{color:var(--muted2)}
.btn.ghost{background:#e6ebf2;color:#1b2430;border:1px solid #cdd6e2}.btn.ghost:hover{background:#d8e1ed}
input[type=text],input[type=number],input:not([type]),select,textarea{background:#fff;color:#1b2430;border:1px solid #b4bfcd;border-radius:6px}
input[type=number]{padding:6px 8px;font-size:13px}
textarea{padding:7px 10px;font:12.5px ui-monospace,Consolas,monospace}
.file-row:hover,.mat-row:hover{background:#eef3fa}
.file-row .fname{color:#1b2430}
.chart-wrap{background:#fff;border-color:var(--border)}

<script>
/* =========================================================================
   DATA LAYER — browser-side helpers (the libraries themselves come from the database, see DBLAYER)
   ========================================================================= */
const MATERIAL_TYPES = ["Vegetation","Soil","Rock","Mineral","Metal","Manmade"];
const NAME_BANK = {
  Vegetation: ["Dry grass","Oak leaf","Pine needles","Corn canopy","Turf grass","Wheat stubble"],
  Soil: ["Sandy loam","Clay soil","Peat","Silty clay","Red laterite","Alluvial soil"],
  Rock: ["Basalt","Sandstone","Granite","Limestone","Shale","Quartzite"],
  Mineral: ["Calcium carbonate","Gypsum","Hematite","Kaolinite","Quartz sand","Mica schist"],
  Metal: ["Copper roofing","Galvanized steel","Aluminum panel","Zinc sheet","Brass fitting"],
  Manmade: ["Asphalt","Concrete","Plastic (HDPE)","Rubber membrane","Painted panel","Brick"],
};
function seededRandom(seed){ const x = Math.sin(seed)*10000; return x - Math.floor(x); }
function makeSpectrum(seed, wlMin=0.4, wlMax=2.5, points=24){
  const arr=[];
  for(let i=0;i<points;i++){
    const wavelength = Number((wlMin + (wlMax-wlMin)*i/(points-1)).toFixed(3));
    const v = 0.12 + 0.5*Math.abs(Math.sin(i*0.4+seed)) + 0.25*seededRandom(seed*13+i);
    arr.push({ wavelength, reflectance: Number(Math.min(v,0.98).toFixed(3)) });
  }
  return arr;
}
function generateMaterials(libSeed, count){
  const out=[];
  for(let i=0;i<count;i++){
    const type = MATERIAL_TYPES[i % MATERIAL_TYPES.length];
    const names = NAME_BANK[type];
    const base = names[i % names.length];
    const repeat = Math.floor(i/names.length);
    const name = repeat>0 ? `${base} ${repeat+1}` : base;
    const seed = libSeed*137 + i*7 + 1;
    out.push({ id:`mat-${libSeed}-${i}`, name, type, samples: 18+Math.floor(seededRandom(seed)*60), resolution:"1 nm", seed });
  }
  return out;
}
const LIBRARY_DEFS = [
  { id:"ecostress", name:"ECOSTRESS", source:"Open Source", color:"emerald", count:6, seed:1 },
  { id:"soil", name:"Open Soil Spectral Library", source:"Open Source", color:"amber", count:6, seed:2 },
  { id:"usgs", name:"USGS Spectral Library", source:"Open Source", color:"sky", count:6, seed:3 },
  { id:"astm", name:"ASTM Library", source:"Custom", color:"purple", count:5, seed:4 },
  { id:"custom1", name:"Custom Library 1", source:"Custom", color:"orange", count:4, seed:5 },
];
const COMPARE_COLORS = ["#34d399","#60a5fa","#f472b6","#fbbf24"];

/* =========================================================================
   STATE
   ========================================================================= */
let state = {
  view: "dashboard",
  libraries: [],
  activeLibId: null,
  activeMatId: null,
  compareList: [],
  recentFiles: [],
  imagesLoaded: 0,
  spectraExtracted: 0,
  libQuery: "",
  globalMatQuery: "",
  matQuery: "",
  showAddLibrary: false,
  showAddMaterial: false,
  matTypeFilter: "",
  importPreview: null,
};

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove("show"), 2400);
}
function addRecent(entry){
  state.recentFiles = [{ id:"r-"+Date.now(), when:"just now", ...entry }, ...state.recentFiles].slice(0,6);
  renderRecent();
}
function setView(v){ state.view = v; if(v==='library-list'){ state.activeLibId=null; state.activeMatId=null; } render(); if(v==='image') openImageView(); if(v==='dashboard'||v==='library-list') loadLibraries(); }
function goToLibraryOld(libId){
  state.activeLibId = libId; state.activeMatId=null; state.view="library-materials";
  state.matQuery=""; state.showAddMaterial=false; state.matTypeFilter=""; state.importPreview=null;
  render();
}
function addLibrary(name, source){
  if(!name || !name.trim()) return;
  const id = "lib-"+Date.now();
  const color = source==="Open Source" ? "sky" : "orange";
  const lib = { id, name:name.trim(), source, color, count:0, seed: state.libraries.length+10, materials:[], user:true };
  state.libraries.push(lib);
  persistUserLibrary();
  state.showAddLibrary = false;
  addRecent({ name:lib.name, type:"Library" });
  showToast(`"${lib.name}" added`);
  renderMainOnly();
}
function submitAddLibrary(){
  const name = document.getElementById("newLibName").value;
  const source = document.getElementById("newLibSource").value;
  addLibrary(name, source);
}
function addMaterial(libId, data){
  try{
    if(data.customData) validateSpectrumRows(sortRows(data.customData));
    const mat = createSample(libId, data);
    if(data.customData) addSpectrum(libId, mat.id, {data:data.customData, origin:data.origin||"library_import", pixel:data.pixel, sourceFormat:data.sourceFormat});
    const lib = state.libraries.find(l=>l.id===libId);
    state.showAddMaterial = false;
    persistUserLibrary();
    addRecent({ name:mat.name, type:"Spectrum" });
    showToast(`"${mat.name}" added to ${lib.name}${mat.customData ? "" : " — no spectrum yet, open it to add one"}`);
    renderMainOnly();
    return mat;
  }catch(e){ showToast(e.message); return null; }
}
function submitAddMaterial(libId){
  const name = document.getElementById("newMatName").value;
  const type = document.getElementById("newMatType").value;
  const samples = parseInt(document.getElementById("newMatSamples").value, 10) || 20;
  const latitude = document.getElementById("newMatLat").value;
  const longitude = document.getElementById("newMatLon").value;
  const locationName = document.getElementById("newMatLoc").value;
  addMaterial(libId, { name, type, samples, latitude, longitude, locationName });
}
function goToMaterialOld(libId, matId){
  state.activeLibId = libId; state.activeMatId = matId; state.view = "library-spectrum";
  state.spectraExtracted++;
  const lib = state.libraries.find(l=>l.id===libId);
  const mat = lib?.materials.find(m=>m.id===matId);
  if(mat) addRecent({ name:mat.name, type:"Spectrum" });
  render();
}
function toggleCompare(libId, matId){
  const i = state.compareList.findIndex(c=>c.libId===libId && c.matId===matId);
  if(i>=0){ state.compareList.splice(i,1); }
  else{
    if(state.compareList.length>=4){ showToast("You can compare up to 4 materials"); return; }
    state.compareList.push({libId, matId});
  }
  render();
}
function downloadCSV(filename, rows){
  const header = "wavelength_um,reflectance\n";
  const body = rows.map(r=>`${r.wavelength},${r.reflectance}`).join("\n");
  const blob = new Blob([header+body], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}
function downloadTXT(filename, rows){
  const body = rows.map(r=>`${r.wavelength}\t${r.reflectance}`).join("\n");
  const blob = new Blob([body], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}
function downloadJSON(filename, rows){
  const blob = new Blob([JSON.stringify(rows, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

/* ---- spectrum file import: CSV / TXT (ASCII) / JSON ---- */
function parseSpectrumText(text, ext){
  text = text.trim();
  if(ext === "json" || text.startsWith("[") || text.startsWith("{")){
    try{
      const parsed = JSON.parse(text);
      const arr = Array.isArray(parsed) ? parsed : (parsed.data || parsed.samples || []);
      const rows = arr.map(r => ({
        wavelength: Number(r.wavelength ?? r.wavelength_um ?? r.x),
        reflectance: Number(r.reflectance ?? r.y),
      })).filter(r => !isNaN(r.wavelength) && !isNaN(r.reflectance));
      return rows.length ? rows : null;
    } catch(e){ return null; }
  }
  // CSV / TXT / ASCII — comma, tab, or space delimited, one pair per line
  const rows = [];
  text.split(/\r?\n/).forEach(line=>{
    const parts = line.trim().split(/[,\t\s]+/).filter(Boolean);
    if(parts.length>=2){
      const w = Number(parts[0]), r = Number(parts[1]);
      if(!isNaN(w) && !isNaN(r)) rows.push({wavelength:w, reflectance:r});
    }
  });
  return rows.length ? rows : null;
}
function triggerImportFileOld(libId){
  const input = document.getElementById("importFileInput");
  input.dataset.libId = libId;
  input.click();
}
function handleImportFileOld(e){
  const file = e.target.files?.[0];
  const libId = e.target.dataset.libId;
  if(!file) return;
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  const supported = ["csv","txt","json","asc"];
  const reader = new FileReader();
  reader.onload = () => {
    if(!supported.includes(ext)){
      showToast(`.${ext} isn't parsed directly in this demo — export it as CSV/TXT/JSON first`);
      return;
    }
    const rows = parseSpectrumText(reader.result, ext);
    if(!rows){
      showToast("Couldn't read any wavelength/reflectance pairs from that file");
      return;
    }
    state.importPreview = {
      libId, rows, format: ext.toUpperCase(),
      suggestedName: file.name.replace(/\.[^.]+$/, ""),
    };
    renderMainOnly();
  };
  reader.readAsText(file);
  e.target.value = "";
}
function cancelImport(){ state.importPreview = null; renderMainOnly(); }
function submitImport(){
  const ip = state.importPreview;
  if(!ip) return;
  const name = document.getElementById("importMatName").value || ip.suggestedName;
  const type = document.getElementById("importMatType").value;
  const latitude = document.getElementById("importMatLat").value;
  const longitude = document.getElementById("importMatLon").value;
  const locationName = document.getElementById("importMatLoc").value;
  addMaterial(ip.libId, {
    name, type, samples: ip.rows.length, customData: ip.rows,
    latitude, longitude, locationName, sourceFormat: ip.format,
  });
  state.importPreview = null;
}

/* =========================================================================
   CHART — lightweight inline SVG line chart (no external chart library)
   ========================================================================= */
function svgLineChart(seriesList, opts={}){
  // seriesList: [{name, color, data:[{x,y}]}]
  const w = opts.width || 560, h = opts.height || 200;
  const padL=34, padR=10, padT=10, padB=22;
  const allX = seriesList.flatMap(s=>s.data.map(d=>d.x));
  const xMin = Math.min(...allX), xMax = Math.max(...allX);
  let yMin=0, yMax=1;
  if(opts.yAuto){
    const allY = seriesList.flatMap(s=>s.data.map(d=>d.y));
    yMin = Math.min(...allY); yMax = Math.max(...allY);
    if(yMin===yMax){ yMin-=1; yMax+=1; }
    const pad = (yMax-yMin)*0.08;
    yMin -= pad; yMax += pad;
  }
  const xs = x => padL + ( (x-xMin)/(xMax-xMin||1) ) * (w-padL-padR);
  const ys = y => (h-padB) - ( (y-yMin)/(yMax-yMin) ) * (h-padT-padB);

  let grid = "";
  for(let i=0;i<=4;i++){
    const gy = padT + i*(h-padT-padB)/4;
    grid += `<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" class="chart-grid"/>`;
    grid += `<text x="4" y="${gy+3}" class="chart-tick">${(yMax - i*(yMax-yMin)/4).toFixed(opts.yAuto?3:2)}</text>`;
  }
  const xTicks = 5;
  for(let i=0;i<=xTicks;i++){
    const gx = padL + i*(w-padL-padR)/xTicks;
    const val = xMin + i*(xMax-xMin)/xTicks;
    grid += `<text x="${gx-8}" y="${h-6}" class="chart-tick">${val.toFixed(2)}</text>`;
  }

  let lines = "";
  seriesList.forEach(s=>{
    const pts = s.data.map(d=>`${xs(d.x)},${ys(d.y)}`).join(" ");
    lines += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
  });

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" class="chart-axis"/>
    <line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" class="chart-axis"/>
    ${grid}
    ${lines}
  </svg>`;
}

function renderSpectrumViewerLocal(){
  const lib = state.libraries.find(l=>l.id===state.activeLibId);

  if(!lib || !mat) return `<p>Material not found.</p>`;
  const hasReal = !!mat.customData, empty = mat.user && !hasReal;
  const data = hasReal ? mat.customData : makeSpectrum(mat.seed);
  const chart = svgLineChart([{name:mat.name, color:"#34d399", data:data.map(d=>({x:d.wavelength,y:d.reflectance}))}]);
  const isComparing = state.compareList.some(c=>c.libId===lib.id && c.matId===mat.id);
  const fname = mat.name.replace(/\s+/g,"_");

  return `

  ${hasLoc ? `<p style="font-size:12.5px; color:var(--muted2); margin:-10px 0 16px;">📍 ${mat.locationName || "Location"} (${mat.latitude.toFixed(4)}, ${mat.longitude.toFixed(4)})</p>` : ""}

  ${empty ? `<div class="placeholder-card">No spectrum yet. Add one from a CSV/TXT/JSON file, or save an image pixel to a sample with this name.</div>` : `<div class="chart-wrap">${chart}</div>`}
  ${mat.spectra && mat.spectra.length ? `<p style="font-size:11.5px; color:var(--muted); margin:8px 0 0;">${mat.spectra.length} spectrum${mat.spectra.length===1?"":"s"} stored (${[...new Set(mat.spectra.map(s=>s.origin))].join(", ")}) — saved in this browser. The chart shows the first.</p>` : ""}

  <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;">
    ${empty ? "" : `<button class="btn ghost btn-sm" onclick='downloadCSV("${fname}.csv", ${JSON.stringify(data)})'>Export CSV</button>
    <button class="btn ghost btn-sm" onclick='downloadTXT("${fname}.txt", ${JSON.stringify(data)})'>Export TXT</button>
    <button class="btn ghost btn-sm" onclick='downloadJSON("${fname}.json", ${JSON.stringify(data)})'>Export JSON</button>`}
    ${mat.user ? `<button class="btn ghost btn-sm" onclick="document.getElementById('attachFileInput').click()">Add spectrum from file</button>

      ${isComparing ? 'Remove from comparison' : 'Add to comparison'}

}

/* =========================================================================
   RENDER — COMPARISON VIEW
   ========================================================================= */
function renderComparison(){
  if(state.compareList.length===0){
    return `<h1 class="pagetitle">Comparison</h1><p class="pagesub">Open a material from a library and press “Add to comparison”.</p>`;
  }
  const items = state.compareList.map(c=>{
    const lib = state.libraries.find(l=>l.id===c.libId);
    const mat = lib.materials.find(m=>m.id===c.matId);
    return {lib, mat};
  });
  const series = items.map((it,i)=>({
    name: it.mat.name, color: COMPARE_COLORS[i % COMPARE_COLORS.length],
    data: compareData(it.mat).map(d=>({x:d.wavelength,y:d.reflectance}))
  }));
  const chart = dsChart(series);
  const chips = items.map((it,i)=>`
    <span class="compare-chip">
      <span style="width:8px;height:8px;border-radius:50%;background:${COMPARE_COLORS[i%COMPARE_COLORS.length]}"></span>
      ${it.mat.name} <span style="color:var(--muted)">(${it.lib.name})</span>
      <button onclick="toggleCompare('${it.lib.id}','${it.mat.id}')">&times;</button>
    </span>
  `).join("");
  return `
  <h1 class="pagetitle">Comparison</h1>
  <p class="pagesub">Overlaying reflectance spectra for ${items.length} material${items.length>1?'s':''}.</p>
  <div class="chart-wrap">${chart}</div>
  <div style="margin-top:10px;">${chips}</div>
  `;
}

/* =========================================================================
   RENDER — LIBRARY MAP (georeferencing)
   ========================================================================= */
function renderLibraryMap(){
  const geoMats = [];
  state.libraries.forEach(l=>{
    l.materials.forEach(m=>{
      if(m.latitude!=null && m.longitude!=null) geoMats.push({l,m});
    });
  });

  if(geoMats.length===0){
    return `
    <div class="crumb" onclick="setView('library-list')">&larr; Library</div>
    <h1 class="pagetitle">Map view</h1>
    <p class="pagesub">Materials with a saved location will show up here.</p>
    <div class="placeholder-card">No georeferenced materials yet — add latitude/longitude when creating or importing a material.</div>
    `;
  }

  const w=760, h=380;
  const toXY = (lat,lon) => ({ x: (lon+180)/360*w, y: (90-lat)/180*h });
  let grid = "";
  for(let lon=-180; lon<=180; lon+=30){
    const x = (lon+180)/360*w;
    grid += `<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="#1e293b" stroke-width="1"/>`;
  }
  for(let lat=-90; lat<=90; lat+=30){
    const y = (90-lat)/180*h;
    grid += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="#1e293b" stroke-width="1"/>`;
  }
  const pins = geoMats.map(({l,m})=>{
    const {x,y} = toXY(m.latitude, m.longitude);
    return `<g style="cursor:pointer;" onclick="goToMaterial('${l.id}','${m.id}')">
      <circle cx="${x}" cy="${y}" r="6" fill="#34d399" stroke="#022c22" stroke-width="1.5"/>
      <title>${m.name} — ${m.locationName || ''} (${m.latitude.toFixed(2)}, ${m.longitude.toFixed(2)})</title>
    </g>`;
  }).join("");

  const listRows = geoMats.map(({l,m})=>`
    <div class="mat-row" onclick="goToMaterial('${l.id}','${m.id}')">
      <span>${m.name} <span style="color:var(--muted); font-size:11.5px;">— ${l.name}</span></span>
      <span class="mat-tag">${m.locationName || `${m.latitude.toFixed(2)}, ${m.longitude.toFixed(2)}`}</span>
    </div>
  `).join("");

  return `
  <div class="crumb" onclick="setView('library-list')">&larr; Library</div>
  <h1 class="pagetitle">Map view</h1>
  <p class="pagesub">${geoMats.length} georeferenced material${geoMats.length>1?'s':''}. Click a pin to open its spectrum.</p>

  <div class="chart-wrap" style="overflow-x:auto;">
    <svg viewBox="0 0 ${w} ${h}" width="100%" style="min-width:520px; background:#020617; border-radius:6px;">
      ${grid}
      ${pins}
    </svg>
  </div>
  <p style="font-size:11px; color:var(--muted); margin-top:8px;">Simple lat/lon grid, not a real basemap — this demo has no map-tile service.</p>

  <div class="panel-list" style="margin-top:16px;">${listRows}</div>
  `;
}

function drawCanvas(){
  const canvas = document.getElementById("imgCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(imgState.imgEl){
    ctx.drawImage(imgState.imgEl,0,0,canvas.width,canvas.height);
  } else {
    const cols=16, rows=9, cw=canvas.width/cols, ch=canvas.height/rows;
    const palette = ["#3f6212","#65a30d","#78716c","#a16207","#57534e"];
    for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
      const idx = Math.floor(seededRandom(i*13+j*7)*palette.length);
      ctx.fillStyle = palette[idx];
      ctx.fillRect(i*cw, j*ch, cw, ch);
    }
  }
  drawLabelMarkers(ctx);
  drawRoiOverlay(ctx);
}
function drawLabelMarkers(ctx){
  imgState.labels.forEach(l=>{
    ctx.beginPath(); ctx.arc(l.x,l.y,4,0,Math.PI*2);
    ctx.fillStyle="#f472b6"; ctx.fill();
    ctx.strokeStyle="#1c0a2e"; ctx.lineWidth=1.2; ctx.stroke();
  });
}
function isTiffFile(file){
  const n = file.name.toLowerCase();
  return n.endsWith(".tif") || n.endsWith(".tiff") || file.type === "image/tiff";
}
function isZarrZipFile(file){
  const n = file.name.toLowerCase();
  return n.endsWith(".zarr.zip") || n.endsWith(".zip");
}
function isEnviHdrFile(file){
  return file.name.toLowerCase().endsWith(".hdr");
}
function handleImageUpload(e){
  const files = Array.from(e.target.files || []);
  if(files.length === 0) return;

  if(files.length >= 2){
    const hdr = files.find(f=>isEnviHdrFile(f));
    const dataFile = files.find(f=>f!==hdr);
    if(hdr && dataFile){ handleEnviFile(hdr, dataFile); return; }
    showToast("Select exactly one .hdr file together with its paired data file");
    return;
  }

  const file = files[0];
  if(isEnviHdrFile(file)){
    showToast("Also select the paired data file — Ctrl/Cmd-click both the .hdr and the data file in the picker");
    return;
  }
  if(isTiffFile(file)){ handleTiffFile(file); return; }
  if(isZarrZipFile(file)){ handleZarrFile(file); return; }

  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      imgState.imgEl = img;
      imgState.fileName = file.name;
      imgState.naturalW = img.naturalWidth;
      imgState.naturalH = img.naturalHeight;
      imgState.pixel = null;
      imgState.pixelHistory = [];
      imgState.showSaveForm = false;
      imgState.tiff = null;
      imgState.labels = [];
      imgState.geo = null;
      imgState.gcps = [];
      state.imagesLoaded++;
      addRecent({name:file.name, type:"Hyperspectral Image"});
      showToast("Image loaded (used as a visual stand-in in this demo)");
      renderMainOnly();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* =========================================================================
   REAL TIFF / GeoTIFF SUPPORT — works with any .tif/.tiff, single- or
   multi-band (e.g. a 224-band EnMAP L2A SPECTRAL_IMAGE.TIF). Uses geotiff.js,
   loaded entirely client-side — the file never leaves the browser.
   ========================================================================= */
async function handleTiffFile(file){
  showToast(`Reading ${file.name}…`);
  try{
    const buf = await file.arrayBuffer();
    const geotiff = await GeoTIFF.fromArrayBuffer(buf);
    const image = await geotiff.getImage();
    const width = image.getWidth();
    const height = image.getHeight();
    const bandCount = image.getSamplesPerPixel();
    let noDataValue = null;
    try{ const nd = image.getGDALNoData(); if(nd !== null && nd !== undefined) noDataValue = nd; }catch(e){}

    imgState.imgEl = null;
    imgState.fileName = file.name;
    imgState.naturalW = width;
    imgState.naturalH = height;
    imgState.pixel = null;
    imgState.pixelHistory = [];
    imgState.showSaveForm = false;
    imgState.geo = null;
    imgState.gcps = [];
    imgState.labels = [];
    imgState.tiff = {
      source:'tiff', image, width, height, bandCount,
      bandCache: new Map(),      // bandIndex(0-based) -> {data, min, max}
      wavelengths: null,         // optional, filled in via metadata XML upload
      cube: null,                // filled in via "load full spectral cube"
      cubeLoading: false,
      noDataValue,
      rIdx: Math.max(0, Math.round(bandCount*0.7)-1),
      gIdx: Math.max(0, Math.round(bandCount*0.5)-1),
      bIdx: Math.max(0, Math.round(bandCount*0.25)-1),
      _readBand: async(idx) => (await image.readRasters({ samples:[idx], interleave:false }))[0],
    };
    state.imagesLoaded++;
    addRecent({name:file.name, type:"Hyperspectral Image (TIFF)"});
    showToast(`Loaded ${bandCount}-band TIFF (${width}×${height}px)`);
    renderMainOnly();
    await renderTiffComposite();
  }catch(err){
    console.error(err);
    showToast("Couldn't read that TIFF — see console for details");
  }
}
async function getTiffBand(idx){
  const t = imgState.tiff;
  if(t.bandCache.has(idx)) return t.bandCache.get(idx);
  const data = await t._readBand(idx);
  const nd = t.noDataValue;
  let min=Infinity, max=-Infinity;
  for(let i=0;i<data.length;i++){
    const v=data[i];
    if(nd!==null && v===nd) continue;
    if(v<min) min=v; if(v>max) max=v;
  }
  const entry = { data, min, max };
  t.bandCache.set(idx, entry);
  return entry;
}
async function renderTiffComposite(){
  const t = imgState.tiff;
  if(!t) return;
  const canvas = document.getElementById("imgCanvas");
  if(!canvas) return;
  canvas.width = t.width;
  canvas.height = t.height;

  const [rB,gB,bB] = await Promise.all([getTiffBand(t.rIdx), getTiffBand(t.gIdx), getTiffBand(t.bIdx)]);
  const n = t.width*t.height;
  const imgData = new ImageData(t.width, t.height);
  const stretch = (b,i) => {
    const range = (b.max-b.min) || 1;
    return Math.max(0, Math.min(255, Math.round((b.data[i]-b.min)/range*255)));
  };
  for(let i=0;i<n;i++){
    imgData.data[i*4]   = stretch(rB,i);
    imgData.data[i*4+1] = stretch(gB,i);
    imgData.data[i*4+2] = stretch(bB,i);
    imgData.data[i*4+3] = 255;
  }
  canvas.getContext("2d").putImageData(imgData, 0, 0);
  drawLabelMarkers(canvas.getContext("2d"));
  drawRoiOverlay(canvas.getContext("2d"));

  // Cache an off-DOM copy so the georeferencing panel (a different canvas,
  // on a different view) can draw the same composite without recomputing it.
  if(!t.previewCanvas){ t.previewCanvas = document.createElement("canvas"); }
  t.previewCanvas.width = t.width;
  t.previewCanvas.height = t.height;
  t.previewCanvas.getContext("2d").putImageData(imgData, 0, 0);
}
function bandLabel(t, idx){
  if(t.wavelengths && t.wavelengths[idx] != null) return `Band ${idx+1} (${t.wavelengths[idx].toFixed(1)} nm)`;
  return `Band ${idx+1}`;
}
function setTiffBand(channel, idx){
  const t = imgState.tiff;
  if(!t) return;
  idx = parseInt(idx,10);
  if(channel==='r') t.rIdx=idx; if(channel==='g') t.gIdx=idx; if(channel==='b') t.bIdx=idx;
  renderMainOnly();
  renderTiffComposite();
}
async function loadFullSpectralCube(){
  const t = imgState.tiff;
  if(!t || t.cube || t.cubeLoading) return;
  t.cubeLoading = true;
  renderMainOnly();
  showToast(`Reading all ${t.bandCount} bands — this can take a while for a large cube…`);
  try{
    if(t.source === 'tiff'){
      const rasters = await t.image.readRasters({ interleave:false });
      t.cube = rasters; // array of TypedArrays, one per band
    } else {
      // Generic path (e.g. Zarr): read band-by-band, reusing/populating the same cache
      const bands = [];
      for(let i=0;i<t.bandCount;i++){
        const {data} = await getTiffBand(i);
        bands.push(data);
        if(i % 20 === 0) showToast(`Reading band ${i+1}/${t.bandCount}…`);
      }
      t.cube = bands;
    }
    showToast("Full spectral cube loaded — click any pixel for its real spectrum");
  }catch(err){
    console.error(err);
    showToast("Couldn't load the full cube (likely out of memory for this image size)");
  }finally{
    t.cubeLoading = false;
    renderMainOnly();
  }
}
function tiffPixelSpectrum(x,y){
  const t = imgState.tiff;
  if(!t || !t.cube) return null;
  const i = y*t.width + x;
  return t.cube.map((bandArr, bi) => ({
    wavelength: t.wavelengths ? t.wavelengths[bi] : (bi+1),
    reflectance: bandArr[i],
  }));
}

/* =========================================================================
   REAL ZARR SUPPORT — a single .zip containing a Zarr v2 array (gzip or
   uncompressed chunks). Reads only the chunks needed for the requested band,
   same lazy philosophy as the TIFF path above. Feeds into the exact same
   imgState.tiff object shape via the generic _readBand() interface, so
   composite rendering, band selection, and pixel spectra all just work.
   ========================================================================= */
function zarrDtypeToTypedArray(bytes, dtype){
  const little = dtype[0] !== '>';
  const typeChar = dtype[1];
  const size = parseInt(dtype.slice(2), 10) || 1;
  if(size===1){
    return typeChar==='u' ? new Uint8Array(bytes.buffer, bytes.byteOffset, bytes.byteLength) : new Int8Array(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  }
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const n = Math.floor(bytes.byteLength/size);
  const out = new Float64Array(n);
  for(let i=0;i<n;i++){
    const off = i*size;
    if(typeChar==='f') out[i] = size===8 ? dv.getFloat64(off, little) : dv.getFloat32(off, little);
    else if(typeChar==='i') out[i] = size===4 ? dv.getInt32(off, little) : size===2 ? dv.getInt16(off, little) : dv.getInt8(off);
    else out[i] = size===4 ? dv.getUint32(off, little) : size===2 ? dv.getUint16(off, little) : dv.getUint8(off);
  }
  return out;
}
function zarrDecompressChunk(bytes, compressor){
  if(!compressor) return bytes;
  if(compressor.id === 'gzip') return fflate.gunzipSync(bytes);
  if(compressor.id === 'zlib') return fflate.unzlibSync(bytes);
  throw new Error(`Unsupported Zarr compressor: "${compressor.id}" (only gzip/zlib/uncompressed are supported)`);
}
async function zarrReadBand(t, bandIndex){
  const m = t.zarrMeta;
  const { shape, chunks, dtype, compressor, bandAxis, spatialAxes, files, prefix, sep } = m;
  const [axH, axW] = spatialAxes;
  const height = shape[axH], width = shape[axW];
  const chunkIdxBand = Math.floor(bandIndex / chunks[bandAxis]);
  const offsetInChunkBand = bandIndex % chunks[bandAxis];
  const out = new Float64Array(height*width);
  const chunkGridH = Math.ceil(height/chunks[axH]);
  const chunkGridW = Math.ceil(width/chunks[axW]);

  for(let ch=0; ch<chunkGridH; ch++){
    for(let cw=0; cw<chunkGridW; cw++){
      const idxArr = [0,0,0];
      idxArr[bandAxis] = chunkIdxBand; idxArr[axH] = ch; idxArr[axW] = cw;
      const key = prefix + idxArr.join(sep);
      const raw = files[key];
      if(!raw) continue; // missing chunk = treated as fill value (left as 0)
      const decompressed = zarrDecompressChunk(raw, compressor);
      const typed = zarrDtypeToTypedArray(decompressed, dtype);
      const dims = [0,0,0].map((_,ax)=>{
        const ci = idxArr[ax];
        return Math.min(chunks[ax], shape[ax]-ci*chunks[ax]);
      });
      const chH = dims[axH], chW = dims[axW];
      for(let ii=0; ii<chH; ii++){
        for(let jj=0; jj<chW; jj++){
          const coord = [0,0,0];
          coord[bandAxis]=offsetInChunkBand; coord[axH]=ii; coord[axW]=jj;
          let lin=0, mul=1;
          for(let ax=2; ax>=0; ax--){ lin += coord[ax]*mul; mul *= dims[ax]; }
          out[(ch*chunks[axH]+ii)*width + (cw*chunks[axW]+jj)] = typed[lin];
        }
      }
    }
  }
  return out;
}
async function handleZarrFile(file){
  showToast(`Unzipping ${file.name}…`);
  try{
    const buf = new Uint8Array(await file.arrayBuffer());
    const files = fflate.unzipSync(buf);
    const zarrayPaths = Object.keys(files).filter(p=>p.endsWith(".zarray"));
    if(zarrayPaths.length===0){
      showToast("No .zarray found inside this zip — is it really a Zarr store?");
      return;
    }
    let best=null;
    for(const p of zarrayPaths){
      const meta = JSON.parse(new TextDecoder().decode(files[p]));
      const count = meta.shape.reduce((a,b)=>a*b,1);
      if(!best || count>best.count) best = {path:p, meta, count};
    }
    const meta = best.meta;
    const prefix = best.path.slice(0, best.path.length - ".zarray".length);
    const sep = meta.dimension_separator || ".";
    const shape = meta.shape;
    if(shape.length !== 3){
      showToast(`This Zarr array has ${shape.length} dimensions — only 3D (band, height, width) arrays are supported right now`);
      return;
    }
    let bandAxis = 0;
    for(let a=1;a<3;a++) if(shape[a]<shape[bandAxis]) bandAxis=a;
    const spatialAxes = [0,1,2].filter(a=>a!==bandAxis);
    const height = shape[spatialAxes[0]], width = shape[spatialAxes[1]];
    const bandCount = shape[bandAxis];

    imgState.imgEl = null;
    imgState.fileName = file.name;
    imgState.naturalW = width;
    imgState.naturalH = height;
    imgState.pixel = null;
    imgState.pixelHistory = [];
    imgState.showSaveForm = false;
    imgState.geo = null;
    imgState.gcps = [];
    imgState.labels = [];
    imgState.tiff = {
      source:'zarr', width, height, bandCount,
      bandCache: new Map(),
      wavelengths: null,
      noDataValue: (meta.fill_value===undefined ? null : meta.fill_value),
      cube: null, cubeLoading:false,
      rIdx: Math.max(0, Math.round(bandCount*0.7)-1),
      gIdx: Math.max(0, Math.round(bandCount*0.5)-1),
      bIdx: Math.max(0, Math.round(bandCount*0.25)-1),
      zarrMeta: { shape, chunks:meta.chunks, dtype:meta.dtype, compressor:meta.compressor, bandAxis, spatialAxes, files, prefix, sep },
      _readBand: async(idx) => zarrReadBand(imgState.tiff, idx),
    };
    state.imagesLoaded++;
    addRecent({name:file.name, type:"Hyperspectral Image (Zarr)"});
    showToast(`Loaded ${bandCount}-band Zarr array (${width}×${height}px) — assumed band axis ${bandAxis} of shape [${shape.join(", ")}]`);
    renderMainOnly();
    await renderTiffComposite();
  }catch(err){
    console.error(err);
    showToast("Couldn't read that Zarr zip — see console for details");
  }
}

/* =========================================================================
   REAL ENVI SUPPORT — a raw flat binary data file + a paired .hdr text
   header (the format AVIRIS-NG and many airborne sensors ship in). No
   compression, so once the file is in memory, reading any single band for
   any interleave (BSQ/BIL/BIP) is just strided indexing — no decode step.
   ========================================================================= */
const ENVI_DTYPE_BYTES = { 1:1, 2:2, 3:4, 4:4, 5:8, 12:2, 13:4 };
function enviReadValue(dv, offset, code, little){
  switch(code){
    case 1: return dv.getUint8(offset);
    case 2: return dv.getInt16(offset, little);
    case 3: return dv.getInt32(offset, little);
    case 4: return dv.getFloat32(offset, little);
    case 5: return dv.getFloat64(offset, little);
    case 12: return dv.getUint16(offset, little);
    case 13: return dv.getUint32(offset, little);
    default: throw new Error(`Unsupported ENVI data type code: ${code}`);
  }
}
function parseEnviHeaderText(text){
  const body = text.replace(/\r\n/g, "\n");
  const meta = {};
  const re = /([a-zA-Z0-9 _]+?)\s*=\s*(\{[\s\S]*?\}|[^\n\r]*)/g;
  let m;
  while((m = re.exec(body))){
    const key = m[1].trim().toLowerCase();
    let val = m[2].trim();
    if(val.startsWith("{") && val.endsWith("}")) val = val.slice(1,-1);
    meta[key] = val;
  }
  return meta;
}
function enviReadBand(t, bandIndex){
  const { buffer, headerOffset, samples, lines, bands, dtypeCode, dtypeBytes, interleave, littleEndian } = t.enviMeta;
  const dv = new DataView(buffer);
  const out = new Float64Array(samples*lines);
  if(interleave === "bsq"){
    const bandStart = headerOffset + bandIndex*samples*lines*dtypeBytes;
    for(let i=0;i<samples*lines;i++) out[i] = enviReadValue(dv, bandStart + i*dtypeBytes, dtypeCode, littleEndian);
  } else if(interleave === "bil"){
    const rowSize = bands*samples*dtypeBytes;
    for(let row=0; row<lines; row++){
      const rowBandStart = headerOffset + row*rowSize + bandIndex*samples*dtypeBytes;
      for(let col=0; col<samples; col++) out[row*samples+col] = enviReadValue(dv, rowBandStart + col*dtypeBytes, dtypeCode, littleEndian);
    }
  } else { // bip
    const pixelStride = bands*dtypeBytes;
    for(let i=0;i<samples*lines;i++) out[i] = enviReadValue(dv, headerOffset + i*pixelStride + bandIndex*dtypeBytes, dtypeCode, littleEndian);
  }
  return out;
}
async function handleEnviFile(hdrFile, dataFile){
  showToast(`Reading ${hdrFile.name}…`);
  try{
    const meta = parseEnviHeaderText(await hdrFile.text());
    const samples = parseInt(meta["samples"], 10);
    const lines = parseInt(meta["lines"], 10);
    const bands = parseInt(meta["bands"], 10);
    if(!samples || !lines || !bands){
      showToast("Couldn't find samples/lines/bands in the .hdr file — is this a valid ENVI header?");
      return;
    }
    const dtypeCode = parseInt(meta["data type"], 10);
    const dtypeBytes = ENVI_DTYPE_BYTES[dtypeCode];
    if(!dtypeBytes){
      showToast(`Unsupported ENVI data type code ${dtypeCode} (complex/int64 types aren't supported)`);
      return;
    }
    const headerOffset = parseInt(meta["header offset"] || "0", 10) || 0;
    const interleave = (meta["interleave"] || "bsq").toLowerCase().trim();
    const littleEndian = (parseInt(meta["byte order"] || "0", 10)) === 0;
    const wavelengths = meta["wavelength"] ? meta["wavelength"].split(",").map(s=>parseFloat(s.trim())).filter(v=>!isNaN(v)) : null;
    const dataIgnoreValue = (meta["data ignore value"]!=null && meta["data ignore value"]!=="") ? parseFloat(meta["data ignore value"]) : null;

    const buffer = await dataFile.arrayBuffer();
    const expectedBytes = headerOffset + samples*lines*bands*dtypeBytes;
    if(buffer.byteLength < expectedBytes){
      showToast(`Warning: data file is smaller than the header describes (${buffer.byteLength} vs ${expectedBytes} bytes expected) — check you selected the matching pair`);
    }

    imgState.imgEl = null;
    imgState.fileName = dataFile.name;
    imgState.naturalW = samples;
    imgState.naturalH = lines;
    imgState.pixel = null;
    imgState.pixelHistory = [];
    imgState.showSaveForm = false;
    imgState.geo = null;
    imgState.gcps = [];
    imgState.labels = [];
    imgState.tiff = {
      source:'envi', width:samples, height:lines, bandCount:bands,
      bandCache: new Map(),
      wavelengths,
      noDataValue: dataIgnoreValue,
      cube: null, cubeLoading:false,
      rIdx: Math.max(0, Math.round(bands*0.7)-1),
      gIdx: Math.max(0, Math.round(bands*0.5)-1),
      bIdx: Math.max(0, Math.round(bands*0.25)-1),
      enviMeta: { buffer, headerOffset, samples, lines, bands, dtypeCode, dtypeBytes, interleave, littleEndian },
      _readBand: async(idx) => enviReadBand(imgState.tiff, idx),
    };
    state.imagesLoaded++;
    addRecent({name:dataFile.name, type:"Hyperspectral Image (ENVI)"});
    showToast(`Loaded ${bands}-band ENVI cube (${samples}×${lines}px, ${interleave.toUpperCase()})`);
    renderMainOnly();
    await renderTiffComposite();
  }catch(err){
    console.error(err);
    showToast("Couldn't read that ENVI file — see console for details");
  }
}

/* Optional: parse an EnMAP-style METADATA.XML for band wavelengths (nm) and
   the four scene corner coordinates, so georeferencing can be set instantly
   instead of manually picking GCPs. This is EnMAP-specific parsing layered
   on top of the generic TIFF support above — a plain TIFF simply won't have
   this file, and band selection still works fine without it. */
async function handleTiffMetadataXml(e){
  const file = e.target.files?.[0];
  if(!file || !imgState.tiff) return;
  const text = await file.text();
  const xml = new DOMParser().parseFromString(text, "application/xml");

  if(imgState.tiff.noDataValue === null){
    const bg = parseFloat(xml.querySelector("backgroundValue")?.textContent);
    if(!isNaN(bg)){
      imgState.tiff.noDataValue = bg;
      imgState.tiff.bandCache.clear(); // recompute min/max excluding no-data now that we know it
    }
  }

  const bandNodes = xml.querySelectorAll("bandCharacterisation bandID");
  if(bandNodes.length){
    const wavelengths = [];
    bandNodes.forEach(node=>{
      const n = parseInt(node.getAttribute("number"),10);
      const wl = parseFloat(node.querySelector("wavelengthCenterOfBand")?.textContent);
      if(!isNaN(n) && !isNaN(wl)) wavelengths[n-1] = wl;
    });
    imgState.tiff.wavelengths = wavelengths;
  }

  const corners = {};
  xml.querySelectorAll("boundingPolygon point").forEach(pt=>{
    const frame = pt.querySelector("frame")?.textContent;
    const lat = parseFloat(pt.querySelector("latitude")?.textContent);
    const lon = parseFloat(pt.querySelector("longitude")?.textContent);
    if(frame && !corners[frame] && !isNaN(lat) && !isNaN(lon)) corners[frame] = {lat,lon};
  });
  if(corners.upper_left && corners.upper_right && corners.lower_left){
    const t = imgState.tiff;
    imgState.gcps = [
      { id:1, px:0,         py:0,          lat:corners.upper_left.lat,  lon:corners.upper_left.lon },
      { id:2, px:t.width-1, py:0,          lat:corners.upper_right.lat, lon:corners.upper_right.lon },
      { id:3, px:0,         py:t.height-1, lat:corners.lower_left.lat,  lon:corners.lower_left.lon },
    ];
    if(corners.lower_right) imgState.gcps.push({ id:4, px:t.width-1, py:t.height-1, lat:corners.lower_right.lat, lon:corners.lower_right.lon });
    imgState.geo = computeAffine(imgState.gcps);
    showToast("Band wavelengths + corner georeferencing loaded from metadata");
  } else {
    showToast("Band wavelengths loaded (no corner coordinates found in this XML)");
  }
  renderMainOnly();
  renderTiffComposite();
}

/* =========================================================================
   GEOREFERENCING — ground control points, affine fit, Leaflet map
   ========================================================================= */
function det3(m){
  return m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1])
       - m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0])
       + m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);
}
function solve3x3(M, rhs){
  const D = det3(M);
  if(Math.abs(D) < 1e-9) return null; // singular — points are collinear
  const Mx = [[rhs[0],M[0][1],M[0][2]],[rhs[1],M[1][1],M[1][2]],[rhs[2],M[2][1],M[2][2]]];
  const My = [[M[0][0],rhs[0],M[0][2]],[M[1][0],rhs[1],M[1][2]],[M[2][0],rhs[2],M[2][2]]];
  const Mz = [[M[0][0],M[0][1],rhs[0]],[M[1][0],M[1][1],rhs[1]],[M[2][0],M[2][1],rhs[2]]];
  return [det3(Mx)/D, det3(My)/D, det3(Mz)/D];
}
function computeAffine(gcps){
  if(!gcps || gcps.length<3) return null;
  let sxx=0,sxy=0,sx=0,syy=0,sy=0,n=gcps.length;
  let sxLat=0,syLat=0,sLat=0, sxLon=0,syLon=0,sLon=0;
  gcps.forEach(g=>{
    const x=g.px, y=g.py;
    sxx+=x*x; sxy+=x*y; sx+=x; syy+=y*y; sy+=y;
    sxLat+=x*g.lat; syLat+=y*g.lat; sLat+=g.lat;
    sxLon+=x*g.lon; syLon+=y*g.lon; sLon+=g.lon;
  });
  const M = [[sxx,sxy,sx],[sxy,syy,sy],[sx,sy,n]];
  const latSol = solve3x3(M, [sxLat, syLat, sLat]);
  const lonSol = solve3x3(M, [sxLon, syLon, sLon]);
  if(!latSol || !lonSol) return null;
  return { a:latSol[0], b:latSol[1], c:latSol[2], d:lonSol[0], e:lonSol[1], f:lonSol[2] };
}
function pixelLatLon(x,y){
  if(!imgState.geo) return null;
  const {a,b,c,d,e,f} = imgState.geo;
  return { lat: a*x+b*y+c, lon: d*x+e*y+f };
}
function residualMeters(fit, g){
  const pred = { lat: fit.a*g.px+fit.b*g.py+fit.c, lon: fit.d*g.px+fit.e*g.py+fit.f };
  const dLatM = (pred.lat-g.lat)*111320;
  const dLonM = (pred.lon-g.lon)*111320*Math.cos(g.lat*Math.PI/180);
  return Math.sqrt(dLatM*dLatM + dLonM*dLonM);
}
function computeRmse(){
  if(!imgState.geo || imgState.gcps.length===0) return 0;
  const sum = imgState.gcps.reduce((s,g)=>s + Math.pow(residualMeters(imgState.geo,g),2), 0);
  return Math.sqrt(sum/imgState.gcps.length);
}
function clearImageGeoreference(){
  imgState.geo = null;
  imgState.gcps = [];
  renderMainOnly();
}

function buildGcpTableRows(){
  if(imgState.gcps.length===0) return `<tr><td colspan="5" style="color:var(--muted);">No points yet.</td></tr>`;

    const errCell = fit ? (()=>{ const err=residualMeters(fit,g); return `<span class="${err>50?'bad':''}">${err.toFixed(1)} m</span>`; })() : '—';
    return `<tr>
      <td>${i+1}</td>
      <td>${g.px}, ${g.py}</td>
      <td>${g.lat.toFixed(5)}, ${g.lon.toFixed(5)}</td>
      <td>${errCell}</td>
      <td><button class="btn ghost btn-sm" onclick="removeGcp(${g.id})">Remove</button></td>
    </tr>`;
  }).join("");
}

function initGeorefMap(){

  }).addTo(georefMap);
  georefMarkersLayer = L.layerGroup().addTo(georefMap);

function handleCanvasClick(e){
  const canvas = document.getElementById("imgCanvas");
  const rect = canvas.getBoundingClientRect();
  const x = Math.round((e.clientX-rect.left)/rect.width*canvas.width);
  const y = Math.round((e.clientY-rect.top)/rect.height*canvas.height);

  if(imgState.roi.active && !imgState.roi.closed){
    imgState.roi.points.push({x,y});
    const counter = document.getElementById("roiPointCount");
    if(counter) counter.textContent = `${imgState.roi.points.length} point${imgState.roi.points.length===1?'':'s'}`;
    redrawCanvasFast();
    return;
  }

  const ctx = canvas.getContext("2d");
  const [r,g,b] = ctx.getImageData(x,y,1,1).data;
  const seed = r*0.3 + g*0.59 + b*0.11 + x + y;
  const geo = pixelLatLon(x,y);
  imgState.pixel = {x,y,seed,geo};
  imgState.showSaveForm = false;
  imgState.pixelHistory = [{x,y,seed}, ...imgState.pixelHistory.filter(p=>!(p.x===x&&p.y===y))].slice(0,6);
  state.spectraExtracted++;
  document.getElementById("pixelPanel").innerHTML = renderPixelPanel();
  renderRecent();
}
function redrawCanvasFast(){

  if(!canvas) return;

function saveCurrentPixelToLibrary(){

  const libId = document.getElementById("saveLibSelect").value;

/* =========================================================================
   ROI POLYGON + "APPLY MODEL TO ROI" — draw a boundary around an earth
   feature, then run a lightweight spectral-angle match (against a chosen
   library's materials) on the pixels inside it. This is a stand-in for the
   real Analysis module, not a trained classifier — the point is to prove
   out the ROI-scoping mechanism and let the resolution/stride control show
   a genuine, measured time-vs-detail trade-off.
   ========================================================================= */
function startRoiDraw(){
  imgState.roi = { active:true, points:[], closed:false };
  imgState.roiResult = null;
  showToast("Click points on the image to trace the ROI, then hit Finish ROI");
  renderMainOnly();
}
function finishRoiDraw(){
  if(imgState.roi.points.length<3){ showToast("Add at least 3 points first"); return; }
  imgState.roi.active=false; imgState.roi.closed=true;
  renderMainOnly();
}
function clearRoi(){
  imgState.roi = { active:false, points:[], closed:false };
  imgState.roiResult = null;
  renderMainOnly();
}
function drawRoiOverlay(ctx){
  const roi = imgState.roi;
  if(roi.points.length){
    ctx.save();
    ctx.strokeStyle = "#fbbf24"; ctx.lineWidth=1.5;
    ctx.setLineDash(roi.closed ? [] : [4,3]);
    ctx.beginPath();
    roi.points.forEach((p,i)=> i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
    if(roi.closed) ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);
    roi.points.forEach(p=>{
      ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2);
      ctx.fillStyle="#fbbf24"; ctx.fill();
    });
    ctx.restore();
  }
  if(imgState.roiResult){
    const { matches, colorFor, stride } = imgState.roiResult;
    ctx.save();
    ctx.globalAlpha = 0.55;
    matches.forEach(m=>{
      ctx.fillStyle = colorFor[m.materialName];
      ctx.fillRect(m.x, m.y, stride, stride);
    });
    ctx.restore();
  }
}
function pointInPolygon(x,y,pts){
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i].x, yi=pts[i].y, xj=pts[j].x, yj=pts[j].y;
    const intersect = ((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi);
    if(intersect) inside=!inside;
  }
  return inside;
}
function roiBoundingBox(pts){
  return {
    minX: Math.min(...pts.map(p=>p.x)), maxX: Math.max(...pts.map(p=>p.x)),
    minY: Math.min(...pts.map(p=>p.y)), maxY: Math.max(...pts.map(p=>p.y)),
  };
}
function getPixelSpectrumForRoi(x,y){
  const t = imgState.tiff;
  if(t && t.cube) return tiffPixelSpectrum(x,y).map(d=>d.reflectance);
  // Fallback demo mode: deterministic per-coordinate synthetic spectrum,
  // same generator the rest of the app uses when no real cube is loaded.
  const seed = (x*12.9898 + y*78.233) % 1000;
  return makeSpectrum(seed, 0.4, 2.5, 24).map(d=>d.reflectance);
}
function spectralAngle(a,b){
  let dot=0, na=0, nb=0;
  const n = Math.min(a.length,b.length);
  for(let i=0;i<n;i++){ dot+=a[i]*b[i]; na+=a[i]*a[i]; nb+=b[i]*b[i]; }
  if(na===0||nb===0) return Math.PI/2;
  const cos = Math.max(-1, Math.min(1, dot/(Math.sqrt(na)*Math.sqrt(nb))));
  return Math.acos(cos);
}
function materialReferenceVector(material, targetLength){
  if(material.customData && material.customData.length){
    const src = material.customData;
    const vec = [];
    for(let i=0;i<targetLength;i++){
      const srcIdx = Math.round(i * (src.length-1) / Math.max(targetLength-1,1));
      vec.push(src[srcIdx].reflectance);
    }
    return { vector: vec, isReal: true };
  }
  return { vector: new Array(targetLength).fill(0.0001), isReal: false };   // no data: never invented (such materials are filtered out before this)
}
async function runRoiClassification(){
  if(cnnState.roiModel==="cnn"){ return runRoiCnn(); }
  if(!imgState.roi.closed || imgState.roi.points.length<3){ showToast("Draw and finish a polygon first"); return; }
  const lib = state.libraries.find(l=>l.id===document.getElementById("roiLibSelect").value);
  const stride = parseInt(document.getElementById("roiResSelect").value,10);
  if(!lib || (lib.db ? lib.count===0 : lib.materials.length===0)){ showToast("Pick a library that has materials in it"); return; }
  if(lib.db){ showToast("Reading the library spectra from the database…"); try{ await dbHydrate(lib); }catch(e){ showToast(e.message); return; } }
  const usable = lib.materials.filter(m=>m.customData && m.customData.length);
  if(!usable.length){ showToast("This library has no reflectance spectra to classify with"); return; }

  const t = imgState.tiff;
  const canvasW = t ? t.width : 480, canvasH = t ? t.height : 270;
  const pts = imgState.roi.points;
  const bbox = roiBoundingBox(pts);
  const minX = Math.max(0, Math.floor(bbox.minX)), maxX = Math.min(canvasW-1, Math.ceil(bbox.maxX));
  const minY = Math.max(0, Math.floor(bbox.minY)), maxY = Math.min(canvasH-1, Math.ceil(bbox.maxY));

  showToast("Running classification…");
  await new Promise(res=>setTimeout(res,10)); // let the toast paint before the loop below blocks the thread

  const t0 = performance.now();
  const PALETTE = ["#34d399","#60a5fa","#f472b6","#fbbf24","#a78bfa","#fb7185","#22d3ee","#facc15"];
  const colorFor = {};
  usable.forEach((m,i)=> colorFor[m.name] = PALETTE[i % PALETTE.length]);

  let sampleLen = null;
  const refVectors = {};
  const referenceIsReal = {};
  const matches = [];
  const counts = {};
  let sampledCount = 0, totalInPoly = 0;

  for(let y=minY; y<=maxY; y+=stride){
    for(let x=minX; x<=maxX; x+=stride){
      if(!pointInPolygon(x,y,pts)) continue;
      totalInPoly++;
      const pixelVec = getPixelSpectrumForRoi(x,y);
      if(sampleLen===null){
        sampleLen = pixelVec.length;
        usable.forEach(m=>{
          const ref = materialReferenceVector(m, sampleLen);
          refVectors[m.id] = ref.vector;
          referenceIsReal[m.name] = ref.isReal;
        });
      }
      let best=null, bestAngle=Infinity;
      usable.forEach(m=>{
        const angle = spectralAngle(pixelVec, refVectors[m.id]);
        if(angle<bestAngle){ bestAngle=angle; best=m; }
      });
      matches.push({x,y,materialName:best.name});
      counts[best.name] = (counts[best.name]||0)+1;
      sampledCount++;
    }
  }
  const elapsedMs = performance.now()-t0;

  let groundInfo = null;
  if(imgState.geo){
    const p0 = pixelLatLon(0,0), px = pixelLatLon(stride,0), py = pixelLatLon(0,stride);
    const mPerDegLat = 111320, mPerDegLon = 111320*Math.cos(p0.lat*Math.PI/180);
    groundInfo = {
      dxM: Math.sqrt(Math.pow((px.lat-p0.lat)*mPerDegLat,2) + Math.pow((px.lon-p0.lon)*mPerDegLon,2)),
      dyM: Math.sqrt(Math.pow((py.lat-p0.lat)*mPerDegLat,2) + Math.pow((py.lon-p0.lon)*mPerDegLon,2)),
    };
  }

  imgState.roiResult = {
    stride, counts, colorFor, matches, elapsedMs, sampledCount, totalInPoly,
    boxW: maxX-minX+1, boxH: maxY-minY+1,
    referenceIsReal, groundInfo,
    usedRealPixelSpectra: !!(t && t.cube),
  };
  renderMainOnly();
  showToast(`Classified ${sampledCount} sampled pixels in ${elapsedMs.toFixed(0)} ms`);
}
function renderRoiResults(){
  const r = imgState.roiResult;
  if(!r) return "";
  const rows = Object.entries(r.counts).sort((a,b)=>b[1]-a[1]).map(([name,count])=>{
    const pct = ((count/r.sampledCount)*100).toFixed(1);
    const isReal = r.referenceIsReal[name];
    return `<tr>
      <td><span style="display:inline-block; width:10px; height:10px; border-radius:2px; background:${r.colorFor[name]}; margin-right:6px;"></span>${name}${isReal?'':' <span style="color:var(--muted); font-size:10.5px;">(synthetic ref)</span>'}</td>
      <td>${count}</td>
      <td>${pct}%</td>
    </tr>`;
  }).join("");
  const groundLine = r.groundInfo
    ? `Effective sampling at this resolution: ~${r.groundInfo.dxM.toFixed(1)} m × ${r.groundInfo.dyM.toFixed(1)} m per sampled point (from your georeferencing fit).`
    : `Not georeferenced — sampling shown in pixels only (1 sample every ${r.stride}px).`;
  return `
  <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--border);">
    <table class="gcp-table">
      <thead><tr><th>Matched material</th><th>Pixels</th><th>Share</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p style="font-size:11.5px; color:var(--muted); margin-top:8px;">
      ${r.sampledCount} of ${r.totalInPoly} points-in-polygon sampled (stride ${r.stride}) over a ${r.boxW}×${r.boxH}px bounding box, in <strong style="color:#e2e8f0;">${r.elapsedMs.toFixed(0)} ms</strong>.
      ${r.usedRealPixelSpectra ? '' : ' (simulated spectra — timing is still real, just not the spectra.)'}
    </p>
    <p style="font-size:11.5px; color:var(--muted); margin:2px 0 0;">${groundLine}</p>
    ${r.modelNote ? `<p style="font-size:11.5px; color:var(--muted); margin:2px 0 0;">${r.modelNote}</p>` : ""}
  </div>`;
}

/* =========================================================================
   PIXEL LABELING — click a pixel, assign it a class/material name, and
   build up a labeled training-sample dataset you can export (with real
   per-band spectra as feature columns, when a full cube is loaded).
   ========================================================================= */
function addPixelLabel(){
  const input = document.getElementById("pixelLabelInput");
  const label = input.value.trim();
  if(!label){ showToast("Type a label first"); return; }
  const {x,y,geo} = imgState.pixel;
  const existing = imgState.labels.find(l=>l.x===x && l.y===y);
  if(existing){
    existing.label = label;
  } else {
    imgState.labels.push({ id:Date.now(), x, y, label, lat: geo?geo.lat:null, lon: geo?geo.lon:null });
  }
  imgState.labelInput = "";
  showToast(`Labeled (${x}, ${y}) as "${label}"`);
  renderMainOnly();
}
function removeLabelPoint(id){
  imgState.labels = imgState.labels.filter(l=>l.id!==id);
  renderMainOnly();
}
function exportLabeledDataset(){
  if(imgState.labels.length===0){ showToast("No labeled points yet"); return; }
  const t = imgState.tiff;
  const hasSpectra = t && t.cube;
  let header = "id,x,y,lat,lon,label";
  if(hasSpectra){
    const wavelengths = t.cube.map((_,bi)=> t.wavelengths ? t.wavelengths[bi] : (bi+1));
    header += "," + wavelengths.map(w=>`wl_${w}`).join(",");
  }
  const rows = imgState.labels.map((l,i)=>{
    let row = `${i+1},${l.x},${l.y},${l.lat??''},${l.lon??''},"${l.label.replace(/"/g,'""')}"`;
    if(hasSpectra){
      const spec = tiffPixelSpectrum(l.x,l.y);
      row += "," + spec.map(d=>d.reflectance).join(",");
    }
    return row;
  });
  const csv = header + "\n" + rows.join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download="labeled_dataset.csv"; a.click();
  URL.revokeObjectURL(url);
  showToast(hasSpectra ? "Exported labeled dataset with full spectra" : "Exported labeled dataset (load full spectrum data first for feature columns)");
}

/* =========================================================================
   LIBRARY STORE — validated sample + spectrum creation, persisted to localStorage.
   createSample() makes a material (sample); addSpectrum() attaches a real spectrum to it.
   Only user-created data is persisted; the seeded demo libraries stay placeholders.
   ========================================================================= */
const LIB_STORE_KEY = "ds3_user_library_v1";
function validateSpectrumRows(rows){
  if(!Array.isArray(rows) || rows.length < 2) throw new Error("Spectrum needs at least 2 wavelength/reflectance points");
  for(let i=0;i<rows.length;i++){
    const w=rows[i].wavelength, r=rows[i].reflectance;
    if(!Number.isFinite(w) || !Number.isFinite(r)) throw new Error(`Non-numeric value at point ${i+1}`);
    if(i>0 && w<=rows[i-1].wavelength) throw new Error(`Wavelengths must be strictly increasing (point ${i+1})`);
    if(r < -100) throw new Error(`Reflectance ${r} at point ${i+1} looks like a no-data value`);
  }
}
function sortRows(r){ return Array.isArray(r) ? r.slice().sort((a,b)=>a.wavelength-b.wavelength) : r; }
function createSample(libId, d){
  const lib = state.libraries.find(l=>l.id===libId);
  if(!lib) throw new Error("Library not found");
  const name = (d.name||"").trim();
  if(!name) throw new Error("Name is required");
  if(lib.materials.some(m=>m.name.toLowerCase()===name.toLowerCase())) throw new Error(`"${name}" already exists in ${lib.name}`);
  const num = (v,lo,hi,what)=>{ if(v===undefined||v===null||v==="") return null; const n=Number(v);
    if(!Number.isFinite(n)||n<lo||n>hi) throw new Error(`${what} must be a number between ${lo} and ${hi}`); return n; };
  const mat = { id:`mat-${libId}-${Date.now()}-${lib.materials.length}`, name, type:d.type||"Manmade", samples:d.samples||0,
    resolution:"1 nm", seed:(Date.now()%10000)+lib.materials.length, customData:null, spectra:[], user:true,
    latitude:num(d.latitude,-90,90,"Latitude"), longitude:num(d.longitude,-180,180,"Longitude"),
    locationName:d.locationName||null, sourceFormat:d.sourceFormat||null };
  lib.materials.push(mat);
  return mat;
}
function addSpectrum(libId, matId, d){
  const lib = state.libraries.find(l=>l.id===libId), mat = lib && lib.materials.find(m=>m.id===matId);
  if(!mat) throw new Error("Sample not found");
  d = {...d, data:sortRows(d.data)};
  validateSpectrumRows(d.data);
  if(!["image_pixel","field","library_import"].includes(d.origin)) throw new Error("origin must be image_pixel, field or library_import");
  mat.spectra = mat.spectra || (mat.customData ? [{id:"sp-0",origin:"library_import",pixel:null,data:mat.customData}] : []);
  const sp = { id:`sp-${Date.now()}-${mat.spectra.length}`, origin:d.origin, pixel:d.pixel||null, data:d.data.map(r=>({wavelength:r.wavelength, reflectance:r.reflectance})) };
  mat.spectra.push(sp);
  if(!mat.customData){ mat.customData = sp.data; mat.samples = sp.data.length; if(d.sourceFormat) mat.sourceFormat = d.sourceFormat; }
  mat.user = true;
  return sp;
}
function persistUserLibrary(){
  try{
    const r6 = v=>Number(v.toPrecision(6));
    const payload = { v:1,
      libs: state.libraries.filter(l=>l.user).map(l=>({id:l.id,name:l.name,source:l.source,color:l.color})),
      mats: state.libraries.flatMap(l=>l.materials.filter(m=>m.user).map(m=>({ libId:l.id, id:m.id, name:m.name, type:m.type,
        latitude:m.latitude, longitude:m.longitude, locationName:m.locationName, sourceFormat:m.sourceFormat,
        spectra:(m.spectra||[]).map(s=>({id:s.id,origin:s.origin,pixel:s.pixel,w:s.data.map(d=>r6(d.wavelength)),r:s.data.map(d=>r6(d.reflectance))})) }))) };
    localStorage.setItem(LIB_STORE_KEY, JSON.stringify(payload)); return true;
  }catch(e){ console.error(e); if(typeof showToast==="function") showToast("Couldn't persist the library (browser storage full or blocked)"); return false; }
}
function restoreUserLibrary(){
  try{
    const raw = localStorage.getItem(LIB_STORE_KEY); if(!raw) return 0;
    const p = JSON.parse(raw); let n=0;
    (p.libs||[]).forEach(l=>{ if(!state.libraries.some(x=>x.id===l.id)) state.libraries.push({...l, count:0, seed:state.libraries.length+10, materials:[], user:true}); });
    (p.mats||[]).forEach(m=>{
      const lib = state.libraries.find(l=>l.id===m.libId); if(!lib || lib.materials.some(x=>x.id===m.id)) return;
      const spectra = m.spectra.map(s=>({id:s.id,origin:s.origin,pixel:s.pixel,data:s.w.map((w,i)=>({wavelength:w,reflectance:s.r[i]}))}));
      lib.materials.push({ id:m.id,name:m.name,type:m.type,samples:spectra[0]?spectra[0].data.length:0,resolution:"1 nm",seed:1,
        customData:spectra[0]?spectra[0].data:null, spectra, user:true, latitude:m.latitude, longitude:m.longitude,
        locationName:m.locationName, sourceFormat:m.sourceFormat }); n++;
    });
    return n;
  }catch(e){ console.error(e); return 0; }
}
