/* CNN-START */
/* =========================================================================
   3D-CNN BASELINE — dependency-free. Input = 5x5 pixel patch x 16 spectral bins
   (spectra resampled by wavelength, z-scored per pixel). Conv3D(8 filters, 3x3x3)+ReLU -> Dense -> Softmax.
   ========================================================================= */
const CNN_D=16, CNN_P=5, CNN_F=8, CNN_MIN_CONF=0.5;
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function gauss(r){ let u=0; while(u===0) u=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r()); }
function cnnCreate(K, seed=1){
  const r=mulberry32(seed), Do=CNN_D-2, Po=CNN_P-2, H=CNN_F*Do*Po*Po;
  const net={K,Do,Po,H,W:new Float64Array(CNN_F*27),b:new Float64Array(CNN_F),Wd:new Float64Array(K*H),bd:new Float64Array(K)};
  for(let i=0;i<net.W.length;i++) net.W[i]=gauss(r)*Math.sqrt(2/27);
  for(let i=0;i<net.Wd.length;i++) net.Wd[i]=gauss(r)*Math.sqrt(1/H);
  return net;
}
function cnnForward(net,x){
  const {Do,Po,H,K}=net, PP=CNN_P*CNN_P, a=new Float64Array(H); let o=0;
  for(let f=0;f<CNN_F;f++){ const wf=f*27;
    for(let d=0;d<Do;d++) for(let i=0;i<Po;i++) for(let j=0;j<Po;j++){
      let s=net.b[f];
      for(let kd=0;kd<3;kd++) for(let ki=0;ki<3;ki++){ const base=(d+kd)*PP+(i+ki)*CNN_P+j, wb=wf+kd*9+ki*3;
        s+=net.W[wb]*x[base]+net.W[wb+1]*x[base+1]+net.W[wb+2]*x[base+2]; }
      a[o++]=s>0?s:0; } }
  const p=new Float64Array(K); let mx=-Infinity;
  for(let k=0;k<K;k++){ let s=net.bd[k]; const wk=k*H; for(let n=0;n<H;n++) s+=net.Wd[wk+n]*a[n]; p[k]=s; if(s>mx) mx=s; }
  let sum=0; for(let k=0;k<K;k++){ p[k]=Math.exp(p[k]-mx); sum+=p[k]; } for(let k=0;k<K;k++) p[k]/=sum;
  return {a,p};
}
function cnnNewGrad(net){ return {W:new Float64Array(net.W.length),b:new Float64Array(CNN_F),Wd:new Float64Array(net.Wd.length),bd:new Float64Array(net.K)}; }
function cnnGrad(net,x,y,g){
  const {a,p}=cnnForward(net,x), {Do,Po,H,K}=net, PP=CNN_P*CNN_P, da=new Float64Array(H);
  for(let k=0;k<K;k++){ const dz=p[k]-(k===y?1:0), wk=k*H; g.bd[k]+=dz;
    for(let n=0;n<H;n++){ g.Wd[wk+n]+=dz*a[n]; da[n]+=net.Wd[wk+n]*dz; } }
  let o=0;
  for(let f=0;f<CNN_F;f++){ const wf=f*27;
    for(let d=0;d<Do;d++) for(let i=0;i<Po;i++) for(let j=0;j<Po;j++){
      const dv=a[o]>0?da[o]:0; o++; if(dv===0) continue; g.b[f]+=dv;
      for(let kd=0;kd<3;kd++) for(let ki=0;ki<3;ki++){ const base=(d+kd)*PP+(i+ki)*CNN_P+j, wb=wf+kd*9+ki*3;
        g.W[wb]+=dv*x[base]; g.W[wb+1]+=dv*x[base+1]; g.W[wb+2]+=dv*x[base+2]; } } }
  let best=0; for(let k=1;k<K;k++) if(p[k]>p[best]) best=k;
  return {loss:-Math.log(Math.max(p[y],1e-12)), correct:best===y};
}
function cnnAdamInit(net){ const z=()=>({W:new Float64Array(net.W.length),b:new Float64Array(CNN_F),Wd:new Float64Array(net.Wd.length),bd:new Float64Array(net.K)}); return {t:0,m:z(),v:z()}; }
function cnnAdamStep(net,g,st,n,lr){
  st.t++; const c1=1-Math.pow(0.9,st.t), c2=1-Math.pow(0.999,st.t);
  for(const key of ["W","b","Wd","bd"]){ const P=net[key],G=g[key],M=st.m[key],V=st.v[key];
    for(let i=0;i<P.length;i++){ const gi=G[i]/n; M[i]=0.9*M[i]+0.1*gi; V[i]=0.999*V[i]+0.001*gi*gi; P[i]-=lr*(M[i]/c1)/(Math.sqrt(V[i]/c2)+1e-8); G[i]=0; } }
}
function zscore(v){ let m=0; for(const x of v) m+=x; m/=v.length; let s=0; for(const x of v) s+=(x-m)*(x-m); s=Math.sqrt(s/v.length)+1e-6; return v.map(x=>(x-m)/s); }
function toMicrons(wl){ return Math.max(...wl)>50 ? wl.map(w=>w/1000) : wl.slice(); }
function makeGrid(lo,hi){ return Array.from({length:CNN_D},(_,i)=>lo+(hi-lo)*i/(CNN_D-1)); }
function resampleToGrid(wl,vals,grid){          // linear interpolation, clamped at the ends
  return grid.map(g=>{ if(g<=wl[0]) return vals[0]; if(g>=wl[wl.length-1]) return vals[vals.length-1];
    let i=1; while(wl[i]<g) i++; const t=(g-wl[i-1])/(wl[i]-wl[i-1]); return vals[i-1]*(1-t)+vals[i]*t; });
}
function libRowsToGrid(rows,grid){
  const wl=toMicrons(rows.map(r=>r.wavelength)), cover=(Math.min(wl[wl.length-1],grid[grid.length-1])-Math.max(wl[0],grid[0]))/(grid[grid.length-1]-grid[0]);
  return cover<0.7 ? null : resampleToGrid(wl,rows.map(r=>r.reflectance),grid);   // null = library spectrum doesn't cover the image range
}
function synthPatch(spec,rnd){                  // library spectrum -> spatially uniform noisy patch
  const PP=CNN_P*CNN_P, x=new Float64Array(CNN_D*PP), mean=spec.reduce((a,b)=>a+b,0)/spec.length;
  for(let p=0;p<PP;p++){ const z=zscore(spec.map(v=>v*(1+0.03*gauss(rnd))+0.01*mean*gauss(rnd))); for(let d=0;d<CNN_D;d++) x[d*PP+p]=z[d]; }
  return x;
}
function jitterPatch(x,rnd){ const y=new Float64Array(x.length); for(let i=0;i<x.length;i++) y[i]=x[i]+0.15*gauss(rnd); return y; }
function cubeSampler(cube,w,h,imgWl,grid){      // returns patchAt(x,y) reading a real cube (array of per-band arrays)
  const wl=toMicrons(imgWl), idx=grid.map(g=>{ if(g<=wl[0]) return [0,0,0]; if(g>=wl[wl.length-1]) return [wl.length-1,wl.length-1,0];
    let i=1; while(wl[i]<g) i++; return [i-1,i,(g-wl[i-1])/(wl[i]-wl[i-1])]; });
  const PP=CNN_P*CNN_P, R=(CNN_P-1)/2;
  return (x,y)=>{ const out=new Float64Array(CNN_D*PP); let p=0;
    for(let dy=-R;dy<=R;dy++) for(let dx=-R;dx<=R;dx++,p++){
      const xx=Math.min(w-1,Math.max(0,x+dx)), yy=Math.min(h-1,Math.max(0,y+dy)), pos=yy*w+xx;
      const z=zscore(idx.map(([a,b,t])=>cube[a][pos]*(1-t)+cube[b][pos]*t)); for(let d=0;d<CNN_D;d++) out[d*PP+p]=z[d]; }

}

async function cnnTrain(trainSet, opts={}, onEpoch){

    real.slice(0,nv).forEach(p=>val.push({x:p,y:k})); pools.push({real:real.slice(nv),lib:c.lib}); });
  const draw=k=>{ const P=pools[k]; if(P.real.length && (!P.lib.length || rnd()<0.5)) return jitterPatch(P.real[Math.floor(rnd()*P.real.length)],rnd);

/* BUILDER-START — ENVI-style Spectral Library Builder: pick grid, add inputs, resample, search, match, save */
const bld = { grid:null, gridSrc:"", items:[], rejected:[], refId:null, query:"", mask:true, divisor:1, libName:"Builder Library" };
const WATER_NM = [[1340,1460],[1790,1960]];

function bldResample(srcNm, vals, gridNm){           // linear, no extrapolation, no bridging NaN gaps
  const out = new Array(gridNm.length).fill(NaN); let j=0;

    const g=gridNm[i]; if(g<srcNm[0] || g>srcNm[srcNm.length-1]) continue;
    while(j<srcNm.length-2 && srcNm[j+1]<g) j++;
    const a=vals[j], b=vals[j+1]; if(!Number.isFinite(a)||!Number.isFinite(b)) continue;

}

function bldAdd(name, srcNm, vals, origin, source){
  if(!bld.grid){ showToast("Choose a wavelength grid first (step 1)"); return false; }
  if(bld.items.some(i=>i.name===name)){ bldReject(name,"duplicate name in this builder session"); return false; }

const API_BASE_URL = (new URLSearchParams(location.search).get("api")
  || (location.protocol.startsWith("http") ? location.origin : "http://127.0.0.1:8000")).replace(/\/$/, "");
function apiUrl(p){ return API_BASE_URL + p; }
function escapeHtml(v){ return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }
function unwrapList(p){ if(Array.isArray(p)) return p; for(const k of ["items","results","data"]) if(p && Array.isArray(p[k])) return p[k]; return []; }
async function apiGet(path){
  const r = await fetch(apiUrl(path), {headers:{"Accept":"application/json"}});
  if(!r.ok){ let d=`Request failed (${r.status})`; try{ const b=await r.json(); d=typeof b.detail==="string"?b.detail:JSON.stringify(b.detail||b); }catch(_){} throw new Error(d); }
  return r.json();
}
async function apiSend(method, path, body, isForm){
  const r = await fetch(apiUrl(path), { method, headers: isForm ? {} : {"Content-Type":"application/json","Accept":"application/json"},
    body: isForm ? body : (body===undefined ? undefined : JSON.stringify(body)) });
  let data=null; try{ data=await r.json(); }catch(_){}
  if(!r.ok) throw new Error((data && data.detail) ? (typeof data.detail==="string" ? data.detail : JSON.stringify(data.detail)) : `Request failed (${r.status})`);
  return data;
}

/* chart that fits any unit / wavelength range (the original chart assumes reflectance 0-1 over 0.4-2.5 um) */
function dsChart(seriesList, opts={}){
  const valid=(seriesList||[]).filter(s=>Array.isArray(s.data)&&s.data.length);
  if(!valid.length) return `<div class="placeholder-card">No spectral values available.</div>`;
  const w=opts.width||560, h=opts.height||220, padL=46, padR=10, padT=10, padB=24;
  const aX=valid.flatMap(s=>s.data.map(d=>+d.x)).filter(Number.isFinite), aY=valid.flatMap(s=>s.data.map(d=>+d.y)).filter(Number.isFinite);
  const xMin=Math.min(...aX), xMax=Math.max(...aX); let yMin=Math.min(...aY), yMax=Math.max(...aY);
  if(yMin>=0 && yMax<=1.2){ yMin=Math.min(0,yMin); yMax=Math.max(1,yMax); } else { const pad=(yMax-yMin)*0.06||1; yMin-=pad; yMax+=pad; }
  const xs=x=>padL+((x-xMin)/(xMax-xMin||1))*(w-padL-padR), ys=y=>(h-padB)-((y-yMin)/(yMax-yMin||1))*(h-padT-padB);
  const yd = (yMax-yMin)>=50?0:((yMax-yMin)>=5?1:2), xd = xMax<10?2:0;
  let grid="";
  for(let i=0;i<=4;i++){ const gy=padT+i*(h-padT-padB)/4; grid+=`<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" class="chart-grid"/><text x="4" y="${gy+3}" class="chart-tick">${(yMax-i*(yMax-yMin)/4).toFixed(yd)}</text>`; }
  for(let i=0;i<=5;i++){ const gx=padL+i*(w-padL-padR)/5; grid+=`<text x="${gx-14}" y="${h-7}" class="chart-tick">${(xMin+i*(xMax-xMin)/5).toFixed(xd)}</text>`; }
  let lines=""; valid.forEach(s=>{ lines+=`<polyline points="${s.data.filter(d=>Number.isFinite(+d.x)&&Number.isFinite(+d.y)).map(d=>`${xs(+d.x)},${ys(+d.y)}`).join(" ")}" fill="none" stroke="${s.color||"#34d399"}" stroke-width="${s.width||2}"/>`; });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Spectrum chart"><line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" class="chart-axis"/><line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" class="chart-axis"/>${grid}${lines}</svg>`;
}

async function loadLibraries(){

    state.libraries=libs.map((l,i)=>({id:String(l.id),name:l.name,main:!!(l.metadata&&l.metadata.main),source:(l.metadata&&l.metadata.main)?"Main library":"Built library",color:LIB_COLORS[i%LIB_COLORS.length],
      count:l.material_count,spectra:l.spectrum_count,db:true,loaded:false,materials:[]})).concat(keep);
    DB.err=null;

  DB.loaded=true; updateStatusbar();

async function dbLoadSpectra(m){

  try{
    const samples=unwrapList(await apiGet(`/api/materials/${m.id}/samples`));
    m.nSamples=samples.length; const out=[];
    for(const s of samples.slice(0,12)){
      for(const sp of unwrapList(await apiGet(`/api/samples/${s.id}/spectra`))) out.push({...sp,sample:s.name,sample_meta:s.metadata});
    }
    m.dbSpectra=out; m.spectraLoaded=true;
    const rows=dbRows(out[0]); m.customData=null;           // keep local-only fields clean
    m.firstRows=rows;
  }catch(e){ m.err=e.message; }
  m.loadingSp=false; renderMainOnly();
}
function dbRows(sp){
  if(!sp) return [];
  return sp.values.map((v,i)=>({wavelength:Number(sp.wavelengths[i]),reflectance:v===null?null:Number(v)})).filter(r=>r.reflectance!==null&&Number.isFinite(r.reflectance));
}
/* library materials turned into the {wavelength(um), reflectance} rows the browser-side classifier expects (real spectra only) */
async function dbHydrate(lib, maxN=300){
  if(!lib||!lib.db) return;
  if(!lib.loaded) await dbLoadMaterials(lib);
  const r=await apiGet(`/api/spectra/search?library_id=${lib.id}&unit=reflectance&limit=${maxN}`);
  const byMat=new Map(); r.results.forEach(h=>{ if(!byMat.has(h.material_id)) byMat.set(h.material_id,h.spectrum_id); });
  await Promise.all(lib.materials.map(async m=>{
    if(m.customData||!byMat.has(m.id)) return;
    try{ const sp=await apiGet(`/api/spectra/${byMat.get(m.id)}`); const rows=dbRows(sp).map(x=>({wavelength:x.wavelength/1000,reflectance:x.reflectance}));
      if(rows.length>=3) m.customData=rows; }catch(_){}
  }));
}
function compareData(m){ return m.customData || (m.firstRows||[]).map(x=>({wavelength:x.wavelength/1000,reflectance:x.reflectance})); }

/* ---- geometry: pixel <-> lat/lon ---- */
function geoCorners(){
  if(I.manualGeo){ const m=I.manualGeo; return [{lat:m.n,lon:m.w},{lat:m.n,lon:m.e},{lat:m.s,lon:m.e},{lat:m.s,lon:m.w}]; }
  return I.geo&&I.geo.has_geo?I.geo.corners:null;
}
function pixelToLatLon(row,col){
  const c=geoCorners(); if(!c||!I.active) return null;
  const fx=(col+0.5)/I.active.cols, fy=(row+0.5)/I.active.rows;
  return {lat:c[0].lat+fx*(c[1].lat-c[0].lat)+fy*(c[3].lat-c[0].lat), lon:c[0].lon+fx*(c[1].lon-c[0].lon)+fy*(c[3].lon-c[0].lon)};
}
function latLonToPixel(lat,lon){
  const c=geoCorners(); if(!c) return null;
  const ax=c[1].lat-c[0].lat, ay=c[1].lon-c[0].lon, bx=c[3].lat-c[0].lat, by=c[3].lon-c[0].lon, px=lat-c[0].lat, py=lon-c[0].lon;
  const det=ax*by-ay*bx; if(!det) return null;
  const fx=(px*by-py*bx)/det, fy=(ax*py-ay*px)/det;
  if(fx<0||fx>=1||fy<0||fy>=1) return null;
  return {row:Math.floor(fy*I.active.rows), col:Math.floor(fx*I.active.cols)};
}
function geoBounds(){ const c=geoCorners(); if(!c) return null; const la=c.map(p=>p.lat), lo=c.map(p=>p.lon); return [[Math.min(...la),Math.min(...lo)],[Math.max(...la),Math.max(...lo)]]; }
function saveManualGeo(){
  const g=k=>parseFloat(document.getElementById("mg_"+k).value);
  const m={n:g("n"),s:g("s"),w:g("w"),e:g("e")};
  if(![m.n,m.s,m.w,m.e].every(Number.isFinite)||m.n<=m.s||m.e<=m.w||Math.abs(m.n)>90||Math.abs(m.s)>90||Math.abs(m.w)>180||Math.abs(m.e)>180){ showToast("North > south and east > west, within ±90 / ±180"); return; }
  I.manualGeo=m; try{ localStorage.setItem("ds3_geo_"+I.active.id,JSON.stringify(m)); }catch(_){}
  refreshAll();
}
function clearManualGeo(){ I.manualGeo=null; try{ localStorage.removeItem("ds3_geo_"+I.active.id); }catch(_){} if(I.mapOn&&!geoCorners()) I.mapOn=false; refreshAll(); }

/* ---- picking pixels and drawing the ROI ---- */
function imgCoords(ev){
  const el=document.getElementById("imgBox"), r=el.getBoundingClientRect();
  const fx=(ev.clientX-r.left)/r.width, fy=(ev.clientY-r.top)/r.height;
  return {row:Math.min(I.active.rows-1,Math.max(0,Math.floor(fy*I.active.rows))), col:Math.min(I.active.cols-1,Math.max(0,Math.floor(fx*I.active.cols)))};
}
async function onImageClick(ev){
  if(!I.preview) return; const p=imgCoords(ev);
  if(I.roi.drawing){ I.roi.pts.push([p.row,p.col]); refreshView(); return; }
  await pickPixel(p.row,p.col);
}
async function pickPixel(row,col){
  I.win=parseInt((document.getElementById("imgWin")||{value:I.win}).value,10)||1;
  try{
    const p=await apiGet(`/api/images/${I.active.id}/pixel?row=${row}&col=${col}&size=${I.win}`);
    I.pixel=p; I.spec={...p,kind:"pixel"}; I.matches=null; I.err=""; if(I.collect) collAdd(p,"px");
  }catch(e){ I.err=e.message; }
  refreshView(); refreshSide(); updateMapMarker();
}
function startRoi(){ I.roi={pts:[],closed:false,drawing:true}; I.mapOn=false; refreshAll(); }
async function finishRoi(){

function clearRoi(){ I.roi={pts:[],closed:false,drawing:false}; if(I.spec&&I.spec.kind==="roi") I.spec=I.pixel?{...I.pixel,kind:"pixel"}:null; refreshAll(); }

/* ---- map in the background ---- */
async function ensureAlphaPreview(){
  const b=I.bands; I.previewA=await apiGet(`/api/images/${I.active.id}/preview?r=${b[0]}&g=${b[1]}&b=${b[2]}&alpha=true`);
}
async function toggleMap(){
  if(I.mapOn){ I.mapOn=false; destroyMap(); refreshAll(); return; }
  if(!geoCorners()){ I.geoOpen=true; I.err="This image has no map coordinates in its file. Enter its corner coordinates under Georeference first."; refreshAll(); return; }
  if(typeof L==="undefined"){ I.err="The map needs internet access (Leaflet and OpenStreetMap could not be loaded)."; refreshAll(); return; }
  I.err=""; I.busy="Preparing the map…"; refreshAll();
  try{ await ensureAlphaPreview(); I.mapOn=true; }catch(e){ I.err=e.message; }
  I.busy=""; refreshAll();
}
function destroyMap(){ if(I.map){ try{ I.map.remove(); }catch(_){} I.map=null; I.mapLayers={}; } }
function initMap(){
  destroyMap(); const el=document.getElementById("imgMap"); if(!el||!I.mapOn||!I.previewA) return;
  const b=geoBounds(); I.map=L.map(el,{zoomControl:true});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(I.map);
  I.mapLayers={img:L.imageOverlay(I.previewA.image,b,{opacity:I.mapOpacity}).addTo(I.map)};
  if(I.overlay) I.mapLayers.cls=L.imageOverlay(I.overlay,b,{opacity:0.8}).addTo(I.map);
  I.map.fitBounds(b);
  I.map.on("click",async e=>{ const p=latLonToPixel(e.latlng.lat,e.latlng.lng); if(p) await pickPixel(p.row,p.col); else showToast("That point is outside the image"); });
  updateMapMarker();
}
function updateMapMarker(){
  if(!I.map||!I.pixel) return; const ll=pixelToLatLon(I.pixel.row,I.pixel.col); if(!ll) return;
  if(I.mapLayers.mk) I.map.removeLayer(I.mapLayers.mk);
  I.mapLayers.mk=L.circleMarker([ll.lat,ll.lon],{radius:6,color:"#fbbf24",weight:2,fillOpacity:0.2}).addTo(I.map);
}
function setMapOpacity(v){ I.mapOpacity=+v; if(I.mapLayers&&I.mapLayers.img) I.mapLayers.img.setOpacity(I.mapOpacity); }

/* ---- libraries brought into the image ---- */
function libById(id){ return state.libraries.find(l=>l.id===id); }
async function addLibraryToImage(id){
  if(!id) return; if(!I.libs.includes(id)) I.libs.push(id);
  I.addOpen=false; await selectImageLibrary(id);
}
async function uploadLibraryForImage(input){
  const files=Array.from(input.files||[]); input.value=""; if(!files.length) return;
  const name=(document.getElementById("imgNewLib")||{}).value;
  I.busy="Reading library file…"; refreshAll();
  try{
    const rep=await apiSend("POST","/api/import",(()=>{ const fd=new FormData(); files.forEach(f=>fd.append("files",f)); if(name&&name.trim()) fd.append("library",name.trim()); return fd; })(),true);
    I.busy=""; await loadLibraries(); state.view="image";
    const lib=state.libraries.find(l=>l.name===rep.library);
    if(lib) await addLibraryToImage(lib.id); else refreshAll();
    showToast(`Library "${rep.library}": ${rep.imported} spectra added`);
  }catch(e){ I.busy=""; I.err=e.message; refreshAll(); }
}
function removeLibraryFromImage(id){ I.libs=I.libs.filter(x=>x!==id); if(I.libId===id){ I.libId=I.libs[0]||""; I.libSpectra=[]; I.picked=new Set(); if(I.libId) selectImageLibrary(I.libId); else refreshAll(); } else refreshAll(); }
async function selectImageLibrary(id){
  I.libId=id; I.picked=new Set(); I.matches=null; I.libQ=""; await loadLibSpectra(); refreshAll();
}
let _lq; function searchLibSpectra(v){ I.libQ=v; clearTimeout(_lq); _lq=setTimeout(async()=>{ await loadLibSpectra(); refreshSide(true); },250); }
async function loadLibSpectra(){
  if(!I.libId){ I.libSpectra=[]; I.libTotal=0; return; }
  try{ const r=await apiGet(`/api/spectra/search?library_id=${I.libId}&limit=500${I.libQ?`&q=${encodeURIComponent(I.libQ)}`:""}`); I.libSpectra=r.results; I.libTotal=r.total; }
  catch(e){ I.err=e.message; }
}
function togglePick(id){ I.picked.has(id)?I.picked.delete(id):I.picked.add(id); drawSpectrumChart(); }

async function bestMatches(){
  const t=target(); if(!t){ I.err="Click a pixel (or draw an ROI) first."; refreshSide(); return; }
  if(!I.libId){ I.err="Add a library first."; refreshSide(); return; }
  I.ignoreUnit=document.getElementById("imgIgnoreUnit").checked; I.err="";
  try{
    const r=await apiSend("POST",`/api/images/${I.active.id}/match`,{...t,library_id:I.libId,ignore_unit:I.ignoreUnit,top_k:10});
    I.matches=r.results; I.note=r.note||""; if(r.results.length) I.picked=new Set([r.results[0].spectrum_id]);
  }catch(e){ I.err=e.message; }
  refreshSide();
}
async function classifyImage(){
  if(!I.libId){ I.err="Add a library first."; refreshSide(); return; }
  I.maxAngle=parseFloat((document.getElementById("imgAngle")||{}).value||0)||0; I.busy="Classifying…"; refreshAll();
  try{
    const ids=Array.from(I.picked);
    const r=await apiSend("POST",`/api/images/${I.active.id}/sam_map`,{library_id:ids.length>1?null:I.libId,spectrum_ids:ids.length>1?ids:null,max_angle_deg:I.maxAngle||null});
    I.overlay=r.overlay; I.legend=r; I.err="";
    I.note=`${r.legend.length} spectra compared on ${r.bands_used} shared bands`+(r.unit_mismatch.length?` · unit differs (image ${I.active.unit}, library ${r.unit_mismatch.join(", ")}): only the spectral shape is compared`:"");
  }catch(e){ I.err=e.message; }
  I.busy=""; refreshAll();
}
function clearMap(){ I.overlay=null; I.legend=null; refreshAll(); }
async function classSpectraFromMap(input){
  const f=(input.files||[])[0]; input.value=""; if(!f||!I.active) return;
  const fd=new FormData(); fd.append("file",f); const n=(document.getElementById("imgClassLib")||{}).value; if(n&&n.trim()) fd.append("library",n.trim());
  try{
    const r=await apiSend("POST",`/api/images/${I.active.id}/labels`,fd,true);
    I.note=`Library "${r.library}": ${r.classes.length} class spectra (${r.classes.slice(0,6).join(", ")})`; I.err="";
    await loadLibraries(); state.view="image"; await addLibraryToImage(r.library_id);
  }catch(e){ I.err=e.message; refreshSide(); }
}
async function storeSpectra(){
  const t=target(); if(!t){ I.err="Click a pixel (or draw an ROI) first."; refreshSide(); return; }
  const lib=(document.getElementById("imgSaveLib").value||"").trim()||"Image spectra", name=(document.getElementById("imgSaveName").value||"").trim()||"spectrum";
  try{
    const r=await apiSend("POST",`/api/images/${I.active.id}/save_pixel`,{...t,library:lib,name});
    showToast(`Stored "${r.material}" in library "${r.library}"`); I.err="";
    await loadLibraries(); state.view="image"; if(I.libs.includes(r.library_id)){ await loadLibSpectra(); } refreshAll();
  }catch(e){ I.err=e.message; refreshSide(); }
}
function exportSpectrum(){
  const s=I.spec; if(!s) return; const rows=s.wavelengths.map((w,i)=>[w,s.values[i]]).filter(r=>r[1]!==null);
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([`wavelength_nm,${s.unit}\n`+rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"}));
  a.download=(s.kind==="roi"?"roi_mean":`pixel_${s.row}_${s.col}`)+".csv"; a.click();
}
function downloadImage(){ if(!I.preview) return; const a=document.createElement("a"); a.href=I.preview.image; a.download=(I.active.name||"image")+"_preview.png"; a.click(); }

/* ---- drawing ---- */
async function drawSpectrumChart(){
  const box=document.getElementById("imgChart"); if(!box) return;
  const s=I.spec; if(!s){ box.innerHTML=`<div class="placeholder-card">Click a pixel on the image to see its spectrum here.</div>`; return; }
  const series=[{name:"image",color:"#e2e8f0",data:s.wavelengths.map((w,i)=>({x:w,y:s.values[i]})).filter(d=>d.y!==null)}];
  const names=[`<span style="color:#e2e8f0">&#9632; ${s.kind==="roi"?`ROI mean (${s.n_pixels} px)`:`pixel (${s.row}, ${s.col})`}</span>`];
  let rescaled=false; const ids=Array.from(I.picked).slice(0,8);
  for(let k=0;k<ids.length;k++){
    try{
      const sp=specCache[ids[k]]||(specCache[ids[k]]=await apiGet(`/api/spectra/${ids[k]}`));
      let data=sp.wavelengths.map((w,i)=>({x:w,y:sp.values[i]})).filter(d=>d.y!==null);
      if(sp.measurement_unit!==s.unit){ const m=Math.max(...data.map(d=>d.y)), pm=Math.max(...series[0].data.map(d=>d.y)); if(m>0){ data=data.map(d=>({x:d.x,y:d.y/m*pm})); rescaled=true; } }
      const h=I.libSpectra.find(x=>x.spectrum_id===ids[k])||(I.matches||[]).find(x=>x.spectrum_id===ids[k]);
      series.push({name:ids[k],color:I_COLORS[k%I_COLORS.length],data}); names.push(`<span style="color:${I_COLORS[k%I_COLORS.length]}">&#9632; ${escapeHtml(h?h.material:ids[k].slice(0,8))}</span>`);
    }catch(_){}
  }
  box.innerHTML=`${dsChart(series,{height:210,width:440})}<div style="font-size:11.5px;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap">${names.join("")}</div>`
    +(rescaled?`<p class="note">Library curves are scaled to the image spectrum (units differ), so only the shape is comparable.</p>`:"");
}
function refreshAll(){ if(state.view!=="image") return; renderMainOnly(); }
function refreshView(){ const v=document.getElementById("imgView"); if(!v){ refreshAll(); return; } v.innerHTML=viewHtml(); if(I.mapOn) initMap(); }
function refreshSide(keepList){ const s=document.getElementById("imgSide"); if(!s){ refreshAll(); return; } s.innerHTML=sideHtml(); drawSpectrumChart(); }

function viewHtml(){
  const a=I.active, pv=I.preview;
  if(!a||!pv) return `<div class="placeholder-card" style="padding:50px 20px;text-align:center">No image yet.<br>Use <b>Open image…</b> — AVIRIS-NG (.hdr + data file together), EnMAP (.zip or .TIF), PaviaU.mat, GeoTIFF, HDF5 / NetCDF.</div>`;
  if(I.mapOn) return `<div style="display:flex;gap:10px;align-items:center;margin-bottom:6px" class="note">Map background · image opacity <input type="range" min="0.1" max="1" step="0.05" value="${I.mapOpacity}" oninput="setMapOpacity(this.value)" style="width:140px"> · click the map to read a pixel</div><div id="imgMap" style="height:600px;border:1px solid var(--border);border-radius:10px;overflow:hidden"></div>`;
  const w=Math.round(pv.width*I.zoom);
  const pts=I.roi.pts.map(p=>`${p[1]},${p[0]}`).join(" ");
  const roi=I.roi.pts.length?`<svg viewBox="0 0 ${a.cols} ${a.rows}" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">
     ${I.roi.closed?`<polygon points="${pts}" fill="rgba(52,211,153,.18)" stroke="#34d399" stroke-width="2" vector-effect="non-scaling-stroke"/>`:`<polyline points="${pts}" fill="none" stroke="#34d399" stroke-width="2" vector-effect="non-scaling-stroke"/>`}
     ${I.roi.pts.map(p=>`<circle cx="${p[1]}" cy="${p[0]}" r="${Math.max(1.5,a.cols/260)}" fill="#34d399"/>`).join("")}</svg>`:"";
  const mk=(I.pixel&&!I.roi.drawing)?`<div style="position:absolute;left:${(I.pixel.col+0.5)/a.cols*100}%;top:${(I.pixel.row+0.5)/a.rows*100}%;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid #fbbf24;border-radius:50%;pointer-events:none"></div>`:"";
  return `<div style="max-height:640px;overflow:auto;border:1px solid var(--border);border-radius:10px;background:#000">
    <div id="imgBox" style="position:relative;width:${w}px;line-height:0;cursor:crosshair" onclick="onImageClick(event)">
      <img src="${pv.image}" style="width:100%;display:block;image-rendering:${I.zoom>1.5?"pixelated":"auto"}" draggable="false">
      ${I.overlay?`<img src="${I.overlay}" style="position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none">`:""}
      ${roi}${collMarkers()}${mk}</div></div>
    <p class="note" style="margin-top:6px">${escapeHtml(a.name)} · ${a.rows}×${a.cols}×${a.bands} · ${escapeHtml(a.unit||"")} · ${a.wavelength_min.toFixed(0)}–${a.wavelength_max.toFixed(0)} nm · zoom ${(I.zoom*100/Math.max(1,pv.step)).toFixed(0)}%${pv.step>1?` · every ${pv.step}. pixel drawn (analysis uses full resolution)`:""}${I.roi.drawing?` · <b style="color:#34d399">drawing ROI: ${I.roi.pts.length} point(s)</b>`:""}</p>
    ${I.legend?`<div style="font-size:11.5px;margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 12px">${I.legend.legend.filter(l=>l.pixels>0).map(l=>`<span><span style="display:inline-block;width:10px;height:10px;background:${l.color};margin-right:4px"></span>${escapeHtml(l.name)} <span style="color:var(--muted)">${l.pixels}</span></span>`).join("")}${I.legend.unmatched?`<span style="color:var(--muted)">unclassified ${I.legend.unmatched}</span>`:""}</div>`:""}`;
}

function geoPanel(){
  if(!I.geoOpen||!I.active) return "";
  const g=I.geo, c=g&&g.has_geo?g.corners:null, m=I.manualGeo||{};
  const nm=["Upper left","Upper right","Lower right","Lower left"];
  return `<div class="card" style="padding:14px;margin:0 0 12px">
    <b>Georeference</b>
    ${c?`<p class="note" style="margin:6px 0">From the file (${escapeHtml(g.crs||"")}):</p><table class="gcp-table" style="max-width:420px"><tr><th></th><th>Latitude</th><th>Longitude</th></tr>${c.map((p,i)=>`<tr><td>${nm[i]}</td><td>${p.lat.toFixed(5)}</td><td>${p.lon.toFixed(5)}</td></tr>`).join("")}</table>`
      :`<p class="note" style="margin:6px 0">${escapeHtml((g&&g.note)||"This file carries no map information.")} Enter the corner coordinates of the image (north-up assumed):</p>`}
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:8px">
      ${[["n","North lat"],["s","South lat"],["w","West lon"],["e","East lon"]].map(([k,l])=>`<div><label class="small">${l}</label><input id="mg_${k}" type="number" step="any" value="${m[k]??""}" style="width:110px"></div>`).join("")}
      <button class="btn emerald btn-sm" onclick="saveManualGeo()">Apply</button>
      ${I.manualGeo?`<button class="btn ghost btn-sm" onclick="clearManualGeo()">Remove manual coordinates</button>`:""}
      <button class="btn ghost btn-sm" onclick="I.geoOpen=false;refreshAll()">Close</button></div>
    ${I.manualGeo?`<p class="note" style="margin:6px 0 0">Manual coordinates are in use (they override the file).</p>`:""}</div>`;
}

function sideHtml(){
  const libs=I.libs.map(id=>libById(id)).filter(Boolean);
  const chips=libs.map(l=>`<span class="compare-chip" style="cursor:pointer;${l.id===I.libId?"border-color:#34d399":""}" onclick="selectImageLibrary('${l.id}')">${escapeHtml(l.name)} <button onclick="event.stopPropagation();removeLibraryFromImage('${l.id}')">&times;</button></span>`).join("");
  const avail=state.libraries.filter(l=>l.db&&!I.libs.includes(l.id));
  const addBox=I.addOpen?`<div style="border:1px solid var(--border);border-radius:8px;padding:8px;margin-top:8px">
      <label class="small">Library from the Library module</label>
      <div style="display:flex;gap:6px"><select id="imgAddSel" style="flex:1">${avail.map(l=>`<option value="${l.id}">${escapeHtml(l.name)} (${l.spectra})</option>`).join("")||"<option value=''>(all libraries already added)</option>"}</select>
      <button class="btn emerald btn-sm" onclick="addLibraryToImage(document.getElementById('imgAddSel').value)">Add</button></div>
      <div style="display:flex;gap:6px;margin-top:8px"><input id="imgNewLib" type="text" placeholder="or: name for a new library" style="flex:1">
      <label class="btn ghost btn-sm" style="cursor:pointer">Upload file…<input type="file" multiple style="display:none" onchange="uploadLibraryForImage(this)"></label></div></div>`:"";
  const lib=libById(I.libId);
  const list=lib?`<input type="text" placeholder="search materials in ${escapeHtml(lib.name)}" value="${escapeHtml(I.libQ)}" oninput="searchLibSpectra(this.value)" style="width:100%;margin-top:8px">
     <div style="max-height:170px;overflow:auto;margin-top:6px;border:1px solid var(--border);border-radius:8px;padding:6px">
     ${I.libSpectra.map(s=>`<label style="display:flex;gap:6px;align-items:center;font-size:12px;padding:2px 0"><input type="checkbox" ${I.picked.has(s.spectrum_id)?"checked":""} onchange="togglePick('${s.spectrum_id}')"> ${escapeHtml(s.material)} <span style="color:var(--muted)">${escapeHtml(s.unit||"")}</span></label>`).join("")||`<span class="note">no materials</span>`}</div>
     ${I.libTotal>I.libSpectra.length?`<p class="note">showing ${I.libSpectra.length} of ${I.libTotal} — use the search box</p>`:""}`:`<p class="note" style="margin-top:8px">Add a library to compare it with the image.</p>`;
  const mt=I.matches?(I.matches.length?`<table style="width:100%;font-size:12px;margin-top:8px;border-collapse:collapse"><tr style="color:var(--muted)"><td>#</td><td>Material</td><td style="text-align:right">Angle</td></tr>${I.matches.map((m,i)=>`<tr style="cursor:pointer" onclick="I.picked=new Set(['${m.spectrum_id}']);refreshSide()"><td>${i+1}</td><td>${escapeHtml(m.material)}</td><td style="text-align:right">${m.angle_deg.toFixed(2)}°</td></tr>`).join("")}</table>`:`<p class="note">no match could be computed</p>`):"";
  const s=I.spec;
  return `${I.err?`<p style="color:#fca5a5;font-size:12px;margin:0 0 8px">${escapeHtml(I.err)}</p>`:""}
  <div class="chart-wrap">
    <p style="font-size:12px;color:#cbd5e1;margin:0 0 8px">${s?(s.kind==="roi"?`ROI mean · ${s.n_pixels} pixels`:`Pixel (${s.row}, ${s.col})${s.n_pixels>1?` · mean of ${s.n_pixels} px`:""}`)+` · ${escapeHtml(s.unit)}`:"Spectrum"}${(()=>{ const ll=(I.pixel&&s&&s.kind==="pixel")?pixelToLatLon(I.pixel.row,I.pixel.col):null; return ll?` · ${ll.lat.toFixed(5)}, ${ll.lon.toFixed(5)}`:""; })()}</p>
    <div id="imgChart"></div>
    ${s?`<div style="margin-top:8px"><button class="btn ghost btn-sm" onclick="exportSpectrum()">Export CSV</button></div>`:""}</div>
  ${collPanel()}<div class="chart-wrap" style="margin-top:12px">
    <div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;color:#cbd5e1">Library</span><button class="btn emerald btn-sm" style="margin-left:auto" onclick="I.addOpen=!I.addOpen;refreshSide()">Add library</button></div>
    ${addBox}<div style="margin-top:8px">${chips}</div>${list}
    <label style="font-size:11.5px;display:flex;gap:6px;margin-top:8px;color:var(--muted2)"><input id="imgIgnoreUnit" type="checkbox" ${I.ignoreUnit?"checked":""}> ignore unit differences (compare spectral shape only)</label>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center">
      <button class="btn emerald btn-sm" onclick="bestMatches()">Best matches</button>
      <button class="btn emerald btn-sm" onclick="classifyImage()" title="Colours every pixel by its closest spectrum (the ticked ones if 2 or more, else the whole library)">Classification map</button>
      ${I.overlay?`<button class="btn ghost btn-sm" onclick="clearMap()">Clear map</button>`:""}
      <span class="note">max angle <input id="imgAngle" type="number" min="0" max="90" value="${I.maxAngle}" style="width:52px">° (0 = none)</span></div>
    ${mt}${I.note?`<p class="note">${escapeHtml(I.note)}</p>`:""}
    <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <input id="imgClassLib" type="text" placeholder="new library name" style="flex:1;min-width:120px">
      <label class="btn ghost btn-sm" style="cursor:pointer" title="Ground-truth map such as PaviaU_gt.mat: one mean spectrum per class">Class spectra from map…<input type="file" accept=".mat,.npy,.tif,.tiff" style="display:none" onchange="classSpectraFromMap(this)"></label></div>
    <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
      <input id="imgSaveName" type="text" value="spectrum" style="width:100px"><input id="imgSaveLib" type="text" value="Image spectra" style="flex:1;min-width:110px">
      <button class="btn ghost btn-sm" onclick="storeSpectra()">Store ${I.roi.closed?"ROI":"pixel"} spectrum to library</button></div>
  </div>`;
}

function renderImagePage(){
  const a=I.active, nb=I.nb;
  const bandOpts=sel=>Array.from({length:nb},(_,i)=>`<option value="${i+1}" ${sel===i+1?"selected":""}>Band ${i+1} · ${I.wl[i]!==undefined?Math.round(I.wl[i])+" nm":""}</option>`).join("");
  const imgOpts=I.list.map(i=>`<option value="${i.id}" ${a&&a.id===i.id?"selected":""}>${escapeHtml(i.name)} (${i.rows}×${i.cols}×${i.bands})</option>`).join("");
  const has=!!(a&&I.preview);
  return `<h1 class="pagetitle">Image</h1>
  <p class="pagesub">Open a hyperspectral image, pick pixels or draw an ROI, and compare them with a spectral library.</p>
  ${I.busy?`<p class="note">&#8987; ${escapeHtml(I.busy)}</p>`:""}
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0">
    <button class="btn emerald btn-sm" onclick="openImageDialog()">Open image…</button><button class="btn ghost btn-sm" onclick="showBandsList()" ${has?"":"disabled"}>Bands…</button>
    <select onchange="openImage(this.value)" style="min-width:220px;max-width:380px">${imgOpts||"<option>(no images yet)</option>"}</select>
    <input id="imgWl" type="text" placeholder="wavelengths, only if the file has none (e.g. 430-860)" style="width:270px">
    ${has?`<button class="btn ghost btn-sm" onclick="deleteImage()">Remove</button>`:""}
  </div>
  ${has?`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0">
    ${["R","G","B"].map((c,k)=>`<span class="small">${c}</span><select id="bandSel${k}" style="max-width:150px">${bandOpts(I.bands[k])}</select>`).join("")}
    <button class="btn ghost btn-sm" onclick="applyBands()">Apply bands</button>

function rsSet(k,val){ LF.r[k]=val; if(k==="mode") renderMainOnly(); }
async function rsRun(){
  const r=LF.r; r.err=""; r.result=null;
  if(!r.libId){ r.err="Choose the library to resample."; renderMainOnly(); return; }
  if(!r.name.trim()){ r.err="Give the new library a name."; renderMainOnly(); return; }
  const body={name:r.name.trim(),mode:r.mode,min_coverage:+r.cov,mask_water:!!r.mask};
  if(r.mode==="range"){ body.start=+r.start; body.end=+r.end; body.step=+r.step; }
  else if(r.mode==="image"){ if(!r.imageId){ r.err="Choose an image."; renderMainOnly(); return; } body.image_id=r.imageId; }
  else body.wavelengths=r.wl.split(/[\s,;]+/).map(parseFloat).filter(Number.isFinite);
  r.busy=true; renderMainOnly();
  try{ r.result=await apiSend("POST",`/api/libraries/${r.libId}/resample`,body); await loadLibraries(); }
  catch(e){ r.err=e.message; }
  r.busy=false; renderMainOnly();
}

async function bldDataOk(){
  const s=BDD.sel; if(!s) return;
  try{ const w=await apiGet(`/api/builder/sources/${s.kind}/${s.id}/wavelengths?band_from=${BDD.from}&band_to=${BDD.to}`);
    BLD2.grid=w.wavelengths; BLD2.gridMode="data"; BLD2.gridSrc=`${s.kind==="image"?"image":"library"} ${s.name}${BDD.to-BDD.from+1<BDD.total?` (bands ${BDD.from}–${BDD.to})`:""}`;
    if(!BDD.recent.find(r=>r.id===s.id)) BDD.recent.unshift({id:s.id,name:s.name});
    BLD2.err=""; lfModalClose(); renderMainOnly(); }

async function bldNewFiles(e, asLibrary){
  const fs=[...e.target.files]; e.target.value=""; if(!fs.length) return;
  const fd=new FormData(); fs.forEach(f=>fd.append("files",f));
  if(asLibrary) fd.append("library", fs[0].name.replace(/\.[^.]+$/,""));
  BDD.openMenu=false; showToast("Reading…");
  try{ const before=new Set(BDD.list.map(x=>x.id)); await apiSend("POST","/api/import",fd,true);
    BDD.list=await apiGet("/api/builder/sources"); await loadLibraries();
    const fresh=BDD.list.findIndex(x=>!before.has(x.id)); BDD.err=""; if(fresh>=0) return bldDataPick(fresh); }
  catch(err){ BDD.err=err.message; }
  bldDataDraw();
}

async function bldAdd(raw, origin){
  /* raw: [{name, wavelengths, values, unit, source}] -> resampled onto the output grid on the backend */
  BLD2.busy=true; BLD2.err=""; renderMainOnly();
  try{
    const r=await apiSend("POST","/api/builder/resample",{spectra:raw.map(s=>({name:s.name,wavelengths:s.wavelengths,values:s.values,unit:s.unit||"reflectance",origin:origin||s.origin||"file",source:s.source||""})),
      grid:BLD2.grid,mask_water:BLD2.maskWater,min_coverage:+BLD2.minCov});
    if(!BLD2.grid && r.grid){ BLD2.grid=r.grid; BLD2.gridSrc="first input spectrum"; }
    r.spectra.forEach(s=>BLD2.items.push({...s,id:"b"+Math.random().toString(36).slice(2,9),category:""}));
    r.rejected.forEach(x=>BLD2.rejected.push(x));
    showToast(`Added ${r.spectra.length}${r.rejected.length?`, rejected ${r.rejected.length}`:""}`);
  }catch(e){ BLD2.err=e.message; }
  BLD2.busy=false; renderMainOnly();
}
async function bldFiles(e){
  const fs=[...e.target.files]; e.target.value=""; if(!fs.length) return;
  const fd=new FormData(); fs.forEach(f=>fd.append("files",f));
  try{ const r=await apiSend("POST","/api/builder/parse",fd,true);

async function bldLibAdd(){

  try{ for(const id of ids){ const sp=specCache[id]||(specCache[id]=await apiGet(`/api/spectra/${id}`)); const h=BLD2.picked.list.find(x=>x.spectrum_id===id);

function bldRemove(id){ BLD2.items=BLD2.items.filter(x=>x.id!==id); if(BLD2.ref===id) BLD2.ref=null; renderMainOnly(); }

function bldAngle(a,b){
  let ab=0,aa=0,bb=0,n=0; for(let i=0;i<a.values.length;i++){ const x=a.values[i],y=b.values[i]; if(x==null||y==null) continue; ab+=x*y; aa+=x*x; bb+=y*y; n++; }
  if(n<3||!aa||!bb) return null; return {deg:Math.acos(Math.min(1,ab/Math.sqrt(aa*bb)))*180/Math.PI,n};
}

function win(title, body, o={}){
  let h=document.getElementById("winHost"); if(!h){ h=document.createElement("div"); h.id="winHost"; document.body.appendChild(h); }
  try{ if(document.activeElement&&h.contains(document.activeElement)) document.activeElement.blur(); }catch(_){}
  if(body===null){ h.innerHTML=""; return; }
  h.innerHTML=`<div class="win-back" onmousedown="if(event.target===this)winClose()"><div class="win" id="winBox" style="width:${o.width||520}px">
    <div class="win-title" id="winTitle"><span>${escapeHtml(title)}</span><button onclick="winClose()" title="Close">&#10005;</button></div>
    <div class="win-body" id="winBody">${body}</div></div></div>`;
  const t=document.getElementById("winTitle"), b=document.getElementById("winBox"); let dx=0,dy=0,sx,sy,drag=false;

/* Available Bands List (ENVI): list of bands, Gray Scale / RGB, R-G-B targets, Dims, Load */
const BL={ id:null, info:null, wl:[], mode:"rgb", cur:"R", sel:{R:0,G:0,B:0} };
function defaultRgb(wl){
  const n=wl.length, near=t=>{ let b=0; wl.forEach((w,i)=>{ if(Math.abs(w-t)<Math.abs(wl[b]-t)) b=i; }); return b; };
  if(wl.length&&Math.min(...wl)<=480&&Math.max(...wl)>=660){ const r=near(650),g=near(550),b=near(470); if(new Set([r,g,b]).size===3) return [r,g,b]; }
  return [Math.floor(n*.75),Math.floor(n*.5),Math.floor(n*.25)].map(x=>Math.min(n-1,Math.max(0,x)));
}
const blName=i=>`Band ${i+1}${BL.wl[i]!==undefined?` (${(+BL.wl[i]).toFixed(2)} nm)`:""}`;
async function showBandsList(id){
  id=id||(I.active&&I.active.id);
  if(!id){ if(I.list.length) id=I.list[0].id; else { openImageDialog(); return; } }
  try{
    const info=I.list.find(i=>i.id===id)||await apiGet(`/api/images/${id}`);
    const bd=await apiGet(`/api/images/${id}/bands`);
    Object.assign(BL,{id,info,wl:bd.wavelengths,mode:"rgb",cur:"R"});
    const d=(I.active&&I.active.id===id&&I.bands)?I.bands.map(b=>b-1):defaultRgb(BL.wl);
    BL.sel={R:d[0],G:d[1],B:d[2]};
    win("Available Bands List",blHtml(),{width:430});
    setTimeout(()=>{ const el=document.querySelector(".bl-item.sel"); if(el) el.scrollIntoView({block:"center"}); },30);
  }catch(e){ showToast(e.message); }
}
function blHtml(){
  const info=BL.info, n=BL.wl.length, rgb=BL.mode==="rgb";
  const tag=i=>["R","G","B"].filter(c=>(rgb||c==="R")&&BL.sel[c]===i).join("");
  const items=BL.wl.map((w,i)=>`<div class="bl-item ${tag(i)?"sel":""}" data-i="${i}" onclick="blPick(${i})"><span class="sq ${tag(i)?"on":""}"></span>${blName(i)}<span class="tag">${tag(i)}</span></div>`).join("");
  const chan=c=>`<div class="bl-ch"><label style="width:42px"><input type="radio" name="blc" ${BL.cur===c?"checked":""} ${!rgb&&c!=="R"?"disabled":""} onclick="BL.cur='${c}'"> ${rgb?c:"Gray"}</label><div class="fld" id="blf${c}">${blName(BL.sel[c])} : ${escapeHtml(info.name)}</div></div>`;
  return `<div class="bl-list" id="blList"><div class="bl-head">&#9662; ${escapeHtml(info.name)}</div>${items}</div>
    <div class="bl-box"><label style="margin-right:18px"><input type="radio" name="blm" ${!rgb?"checked":""} onclick="blMode('gray')"> Gray Scale</label><label><input type="radio" name="blm" ${rgb?"checked":""} onclick="blMode('rgb')"> RGB Color</label></div>
    <div class="bl-box" id="blChans">${rgb?chan("R")+chan("G")+chan("B"):chan("R")}</div>
    <div class="bl-dims">Dims ${info.cols} x ${info.rows} x ${n} · ${escapeHtml(info.unit||"")}${info.format?` · ${escapeHtml(info.format)}`:""}${info.assumed_wavelengths?` · <span style="color:#b45309">wavelengths assumed</span>`:""}</div>
    <div class="row" style="justify-content:space-between"><span><button class="btn blue btn-sm" onclick="blLoad()">${rgb?"Load RGB":"Load Gray"}</button> <span class="note">Display #1</span></span><button class="btn ghost btn-sm" onclick="winClose()">Cancel</button></div>`;
}
function blMode(m){ BL.mode=m; BL.cur="R"; winBody(blHtml()); const el=document.querySelector(".bl-item.sel"); if(el) el.scrollIntoView({block:"center"}); }
function blPick(i){
  BL.sel[BL.cur]=i;
  if(BL.mode==="rgb"){ BL.cur=BL.cur==="R"?"G":BL.cur==="G"?"B":"B"; }
  const sc=document.getElementById("blList").scrollTop; winBody(blHtml()); document.getElementById("blList").scrollTop=sc;
}
async function blLoad(){
  const b=BL.mode==="rgb"?[BL.sel.R,BL.sel.G,BL.sel.B]:[BL.sel.R,BL.sel.R,BL.sel.R];

/* ---------- spectra collected by clicking pixels ---------- */
const COLL_COLORS=["#059669","#2563eb","#db2777","#d97706","#7c3aed","#ea580c","#0891b2","#dc2626","#4d7c0f","#be185d","#0f766e","#6d28d9"];
I.coll=[]; I.collect=true; I.collN=0; I.angles=false;
function collAdd(s,kind){
  if(!s||!s.values) return;
  const key=kind==="roi"?"roi:"+(I.roi.pts||[]).map(p=>p.join(",")).join(";"):`px:${s.row},${s.col},${s.size||1}`;
  if(I.coll.some(c=>c.key===key)){ showToast("This spectrum is already in the list"); return; }
  if(I.coll.length>=24){ showToast("24 spectra collected: remove some first"); return; }
  I.collN++; const color=COLL_COLORS[(I.collN-1)%COLL_COLORS.length];
  I.coll.push({key,color,show:true,kind,row:s.row,col:s.col,n:s.n_pixels||1,unit:s.unit,wavelengths:s.wavelengths,values:s.values,
    name:kind==="roi"?`ROI ${I.collN}`:`Pixel ${I.collN}`});
}
function toggleCollect(){ I.collect=!I.collect; refreshAll(); }
function collClear(){ I.coll=[]; I.collN=0; I.angles=false; if(state.view==="image"){ refreshView(); refreshSide(); } }
function collRemove(i){ I.coll.splice(i,1); refreshView(); refreshSide(); }
function collShow(i,v){ I.coll[i].show=v; drawSpectrumChart(); refreshView(); }
function collName(i,v){ I.coll[i].name=v; drawSpectrumChart(); }
function collMarkers(){
  const a=I.active; if(!a) return "";
  return I.coll.map((c,i)=>c.kind==="px"&&c.show?`<div class="pxmark" style="left:${(c.col+0.5)/a.cols*100}%;top:${(c.row+0.5)/a.rows*100}%;border-color:${c.color};background:${c.color}66">${i+1}</div>`:"").join("");
}
function angleDeg(a,b){
  let ab=0,aa=0,bb=0,n=0; for(let i=0;i<a.length;i++){ const x=a[i],y=b[i]; if(x==null||y==null) continue; ab+=x*y; aa+=x*x; bb+=y*y; n++; }
  if(n<3||!aa||!bb) return null; return Math.acos(Math.max(-1,Math.min(1,ab/Math.sqrt(aa*bb))))*180/Math.PI;
}
function collPanel(){
  const c=I.coll;
  const rows=c.map((s,i)=>`<div class="coll-row"><input type="checkbox" ${s.show?"checked":""} onchange="collShow(${i},this.checked)"><span class="coll-sw" style="background:${s.color}"></span>
    <b style="width:14px;font-size:11px">${i+1}</b><input type="text" value="${escapeHtml(s.name)}" oninput="collName(${i},this.value)">
    <span class="note" style="margin:0;white-space:nowrap">${s.kind==="roi"?`${s.n} px`:`${s.row}, ${s.col}`}</span><button class="coll-x" title="Remove" onclick="collRemove(${i})">&#10005;</button></div>`).join("");
  let ang="";
  if(I.angles&&c.length>1){
    const sh=c.slice(0,10);
    ang=`<div style="overflow:auto;margin-top:8px"><table style="font-size:11px"><tr><th>°</th>${sh.map((s,i)=>`<th>${i+1}</th>`).join("")}</tr>${sh.map((s,i)=>`<tr><th>${i+1}</th>${sh.map((t,j)=>{ const d=i===j?0:angleDeg(s.values,t.values); return `<td style="${d!=null&&d<2?"color:#047857":d>10?"color:#c62828":""}">${d==null?"–":d.toFixed(1)}</td>`; }).join("")}</tr>`).join("")}</table><p class="note">Spectral angle between collected spectra: small = similar shape.</p></div>`;
  }
  return `<div class="chart-wrap" style="margin-top:12px">
    <div style="display:flex;align-items:center;gap:8px"><b style="font-size:12.5px">Collected spectra (${c.length})</b>
      <button class="btn ${I.collect?"emerald":"ghost"} btn-sm" style="margin-left:auto" onclick="toggleCollect()" title="When on, every click on the image adds a spectrum to this list">&#9679; Collect ${I.collect?"on":"off"}</button>
      <button class="btn ghost btn-sm" onclick="collClear()" ${c.length?"":"disabled"}>Clear</button></div>
    ${c.length?`<div style="margin-top:6px;max-height:190px;overflow:auto">${rows}</div>`:`<p class="note">Click pixels on the image one after another (or finish an ROI): each spectrum is added here and plotted together for comparison.</p>`}
    ${ang}
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
      <button class="btn emerald btn-sm" onclick="collBuild()" ${c.length?"":"disabled"}>Build library…</button>
      <button class="btn ghost btn-sm" onclick="I.angles=!I.angles;refreshSide()" ${c.length>1?"":"disabled"}>Compare angles</button>
      <button class="btn ghost btn-sm" onclick="collCsv()" ${c.length?"":"disabled"}>Export CSV</button>
      <button class="btn ghost btn-sm" onclick="anOpen('sam')" ${c.length?"":"disabled"} title="Use the collected spectra as endmembers">Classify (SAM)…</button></div></div>`;
}

/* the plot shows every collected spectrum (colour-coded), the current one, and ticked library spectra */
async function drawSpectrumChart(){
  const box=document.getElementById("imgChart"); if(!box) return;
  const s=I.spec, shown=I.coll.filter(c=>c.show);
  if(!s&&!shown.length){ box.innerHTML=`<div class="placeholder-card">Click a pixel on the image to see its spectrum here.</div>`; return; }
  const series=[], names=[];
  shown.forEach((c,i)=>{ series.push({name:c.name,color:c.color,data:c.wavelengths.map((w,k)=>({x:w,y:c.values[k]})).filter(d=>d.y!==null)}); names.push(`<span style="color:${c.color}">&#9632; ${escapeHtml(c.name)}</span>`); });
  const inColl=s&&I.coll.some(c=>c.show&&((s.kind==="roi"&&c.kind==="roi"&&c.key.startsWith("roi"))||(s.kind!=="roi"&&c.row===s.row&&c.col===s.col)));
  if(s&&!inColl){ series.unshift({name:"current",color:"#1b2430",data:s.wavelengths.map((w,i)=>({x:w,y:s.values[i]})).filter(d=>d.y!==null)}); names.unshift(`<span style="color:#1b2430">&#9632; ${s.kind==="roi"?`ROI mean (${s.n_pixels} px)`:`pixel (${s.row}, ${s.col})`}</span>`); }
  const ref=series[0]; let rescaled=false; const ids=Array.from(I.picked).slice(0,8);
  for(let k=0;k<ids.length;k++){
    try{
      const sp=specCache[ids[k]]||(specCache[ids[k]]=await apiGet(`/api/spectra/${ids[k]}`));
      let data=sp.wavelengths.map((w,i)=>({x:w,y:sp.values[i]})).filter(d=>d.y!==null);
      const unit=(s||shown[0]||{}).unit;
      if(unit&&sp.measurement_unit!==unit&&ref){ const m=Math.max(...data.map(d=>d.y)), pm=Math.max(...ref.data.map(d=>d.y)); if(m>0){ data=data.map(d=>({x:d.x,y:d.y/m*pm})); rescaled=true; } }
      const h=I.libSpectra.find(x=>x.spectrum_id===ids[k])||(I.matches||[]).find(x=>x.spectrum_id===ids[k]);
      const col=["#9ca3af","#6b7280","#a16207","#0e7490","#9d174d","#3f6212","#4338ca","#b91c1c"][k%8];
      series.push({name:ids[k],color:col,data}); names.push(`<span style="color:${col}">&#9633; ${escapeHtml(h?h.material:ids[k].slice(0,8))} <i>(library)</i></span>`);
    }catch(_){}
  }
  box.innerHTML=`${dsChart(series,{height:230,width:460})}<div style="font-size:11.5px;margin-top:6px;display:flex;gap:4px 12px;flex-wrap:wrap">${names.join("")}</div>`
    +(rescaled?`<p class="note">Library curves are scaled to the image spectrum (units differ), so only the shape is comparable.</p>`:"");
}

/* ---------- analysis windows (Spectral menu) ---------- */
const AN={ op:null, last:null, busy:false };
const AN_TITLES={ pca:"Principal Components (PCA)", kmeans:"K-Means Clustering", sam:"Spectral Angle Mapper", unmix:"Linear Spectral Unmixing",
  bandmath:"Band Math / Spectral Index", anomaly:"Anomaly Detection (RX)", snr:"Signal-to-Noise Ratio", analyst:"Spectral Analyst" };
function endmemberSource(){
  const libs=dbLibs();
  return `<h4>Spectra to use</h4>
    <div class="box" style="max-height:130px;overflow:auto">${I.coll.length?I.coll.map((s,i)=>`<label style="display:flex;gap:6px;align-items:center;padding:1px 0"><input type="checkbox" class="anC" value="${i}" checked><span class="coll-sw" style="background:${s.color}"></span>${escapeHtml(s.name)} <span class="note" style="margin:0">${s.kind==="roi"?s.n+" px":`${s.row}, ${s.col}`}</span></label>`).join(""):`<span class="note">No spectra collected yet — click pixels on the image (Collect on), or use a library below.</span>`}</div>
    <div class="row"><label>or all spectra (max 60) of library</label><select id="anLib" style="max-width:240px"><option value="">— none —</option>${libs.map(l=>`<option value="${l.id}">${escapeHtml(l.name)} (${l.spectra})</option>`).join("")}</select></div>`;
}
function anOpen(op,o={}){
  if(!needImage()){ return; }
  AN.op=op; const a=I.active; let body="";
  const range=`${a.wavelength_min.toFixed(0)}–${a.wavelength_max.toFixed(0)} nm, ${a.bands} bands`;
  if(op==="pca") body=`<div class="row"><label>Number of components</label><select id="anN">${[3,4,5,6,8,10].map(n=>`<option>${n}</option>`).join("")}</select></div><p class="note">Shows PC1/PC2/PC3 as an RGB image, the scree plot and the first components.</p>`;
  else if(op==="kmeans") body=`<div class="row"><label>Number of classes</label><input id="anK" type="number" min="2" max="20" value="6" style="width:70px"><label>Iterations</label><input id="anIt" type="number" min="3" max="100" value="20" style="width:70px"></div><p class="note">Unsupervised clustering of all good bands. The class mean spectra can be saved to a library.</p>`;
  else if(op==="sam") body=`${endmemberSource()}<div class="row"><label>Maximum angle (°, 0 = none)</label><input id="anAng" type="number" min="0" max="90" value="0" style="width:70px"></div>`;
  else if(op==="unmix") body=`${endmemberSource()}<div class="row"><label><input id="anS1" type="checkbox" checked> sum-to-one constraint</label></div><p class="note">Non-negative least squares per pixel (decimated image). One abundance map per endmember, plus the dominant endmember and the fit error.</p>`;
  else if(op==="bandmath") body=`<label class="small">Expression — <b>b</b>N = band number (1–${a.bands}), <b>w</b>NNN = band nearest to that wavelength in nm (${range})</label>
    <textarea id="anExpr" rows="3" style="width:100%">${escapeHtml(o.expression||"(w800 - w670) / (w800 + w670)")}</textarea>
    <div class="row"><label>Preset</label><select onchange="if(this.value)document.getElementById('anExpr').value=this.value"><option value="">—</option>
      <option value="(w800 - w670) / (w800 + w670)">NDVI</option><option value="(w790 - w720) / (w790 + w720)">NDRE</option><option value="(w860 - w1240) / (w860 + w1240)">NDWI</option><option value="w2200 / w2100">Clay ratio</option><option value="mean(w450, w550, w650)">Visible mean</option></select></div>
    <p class="note">Operators + - * / **, functions sqrt, log, log10, exp, abs, min, max, mean, where. The bands actually used are listed with the result.</p>`;
  else if(op==="anomaly") body=`<div class="row"><label>PCA components used</label><input id="anComp" type="number" min="2" max="50" value="15" style="width:70px"></div><p class="note">Global RX: Mahalanobis distance of every pixel from the scene background (in the leading principal components).</p>`;
  else if(op==="snr") body=`<p class="note">Nearest-neighbour estimate: the signal is the mean spectrum, the noise is the standard deviation of the difference between neighbouring pixels. Uses the first rows of the scene.</p>`;
  else if(op==="analyst"){ analystOpen(); return; }
  win(AN_TITLES[op],`<p class="note" style="margin:0 0 4px">Image: <b>${escapeHtml(a.name)}</b> · ${a.cols}×${a.rows}×${a.bands}</p>${body}
    <div class="row"><button class="btn blue btn-sm" id="anGo" onclick="anRun()">Run</button><button class="btn ghost btn-sm" onclick="winClose()">Cancel</button></div><div class="err" id="anErr"></div>`,{width:op==="bandmath"?560:480});
  if(o.run) anRun();
}
function collEndmembers(){ return Array.from(document.querySelectorAll(".anC:checked")).map(e=>I.coll[+e.value]).map(s=>({name:s.name,values:s.values})); }
async function anRun(){
  if(AN.busy) return; const op=AN.op, g=id=>document.getElementById(id); let params={}, body={};
  try{
    if(op==="pca") params={n_components:+g("anN").value};
    else if(op==="kmeans") params={k:+g("anK").value,iterations:+g("anIt").value};
    else if(op==="sam"||op==="unmix"){
      params.endmembers=collEndmembers(); const lib=g("anLib").value; if(lib) body.library_id=lib;
      if(!params.endmembers.length&&!lib) throw new Error("Choose at least one spectrum or a library.");
      if(op==="sam") params.max_angle_deg=+g("anAng").value||null; else params.sum_to_one=g("anS1").checked;
    }
    else if(op==="bandmath") params={expression:g("anExpr").value};
    else if(op==="anomaly") params={components:+g("anComp").value};
  }catch(e){ const x=g("anErr"); if(x) x.textContent=e.message; return; }
  AN.busy=true; const go=g("anGo"); if(go){ go.disabled=true; go.textContent="Running…"; }
  const err=document.getElementById("anErr"); if(err) err.textContent="";
  try{
    const r=await apiSend("POST",`/api/images/${I.active.id}/analyze/${op}`,Object.assign({params},body));
    AN.busy=false; AN.last=r; anShow(r);
  }catch(e){ AN.busy=false; const x=g("anErr"), b=g("anGo"); if(x) x.textContent=e.message; else win(AN_TITLES[op],`<div class="err">${escapeHtml(e.message)}</div>`); if(b){ b.disabled=false; b.textContent="Run"; } }
}
const CMAPS={viridis:"#440154,#3b528b,#21918c,#5ec962,#fde725",RdYlGn:"#a50026,#f46d43,#ffffbf,#a6d96a,#006837",inferno:"#000004,#57106e,#bc3754,#f98e09,#fcffa4",magma_r:"#fcfdbf,#fc8961,#b73779,#51127c,#000004",gray:"#000,#fff"};
function fmtNum(v){ if(v==null) return "–"; if(typeof v!=="number") return escapeHtml(v); if(Number.isInteger(v)) return v.toLocaleString(); const a=Math.abs(v); return a>=1000||(a>0&&a<0.01)?v.toExponential(2):v.toFixed(3); }
function anShow(r){
  let body="";
  const imgBox=(src,w)=>`<div style="background:#222;border:1px solid #6d7b8e;display:inline-block;max-width:100%;line-height:0"><img src="${src}" style="width:${Math.min(560,Math.max(320,r.width||320))}px;max-width:100%;max-height:55vh;object-fit:contain;image-rendering:${r.width&&r.width<400?"pixelated":"auto"}"></div>`;
  if(r.image) body+=imgBox(r.image);
  if(r.kind==="scalar") body+=`<div style="max-width:420px;margin-top:6px"><div class="cbar" style="background:linear-gradient(90deg,${CMAPS[r.cmap]||CMAPS.viridis})"></div><div style="display:flex;justify-content:space-between;font-size:11px"><span>${fmtNum(r.range[0])}</span><span>${fmtNum(r.range[1])}</span></div></div>`;
  if(r.kind==="classes") body+=`<div style="display:flex;flex-wrap:wrap;gap:3px 14px;margin-top:8px;font-size:12px">${r.legend.map(l=>`<span><span style="display:inline-block;width:11px;height:11px;background:${l.color};margin-right:5px;vertical-align:-1px"></span>${escapeHtml(l.name)} <span class="note" style="margin:0">${l.pixels.toLocaleString()} px</span></span>`).join("")}${r.unmatched?`<span class="note" style="margin:0">unclassified ${r.unmatched.toLocaleString()} px</span>`:""}</div>`;
  if(r.plot&&r.plot.series&&r.plot.series.length){ const pal=["#2563eb","#dc2626","#059669"]; body+=`<h4>${escapeHtml(r.plot.title||"")}</h4><div class="box">${dsChart(r.plot.series.map((s,i)=>({name:s.name,color:pal[i%3],data:r.plot.x.map((x,k)=>({x,y:s.y[k]})).filter(d=>d.y!==null)})),{height:200,width:520})}<div class="note">x: ${escapeHtml(r.plot.xlabel||"")} · y: ${escapeHtml(r.plot.ylabel||"")}</div></div>`; }
  if(r.table&&Object.keys(r.table).length) body+=`<h4>Statistics</h4><table>${Object.entries(r.table).map(([k,v])=>`<tr><td>${escapeHtml(k)}</td><td>${fmtNum(v)}</td></tr>`).join("")}</table>`;
  if(r.extra&&r.extra.length) body+=`<h4>Further images</h4><div class="thumbs">${r.extra.map((e,i)=>`<figure onclick="anBig(${i})" title="Click to enlarge"><img src="${e.image}"><figcaption>${escapeHtml(e.name)}${e.range?` · ${fmtNum(e.range[0])} … ${fmtNum(e.range[1])}`:""}</figcaption></figure>`).join("")}</div>`;
  body+=`<div class="row" style="margin-top:12px">${r.kind==="classes"?`<button class="btn emerald btn-sm" onclick="anOverlay()">Overlay on the image</button>`:""}
    ${r.spectra&&r.spectra.length?`<button class="btn ghost btn-sm" onclick="anSpectraToColl()">Add ${r.spectra.length} spectra to the collected list</button><button class="btn ghost btn-sm" onclick="anSpectraSave()">Save as library…</button>`:""}
    ${r.image?`<button class="btn ghost btn-sm" onclick="anPng()">Save PNG</button>`:""}<button class="btn ghost btn-sm" onclick="winClose()">Close</button></div>
    <p class="note">Computed on a decimated copy of the scene (step ${r.step}); the full image is not modified.</p>`;
  win(r.title,body,{width:Math.min(760,Math.max(520,(r.width||0)+60))});
}
function anBig(i){ const e=AN.last.extra[i]; win(e.name,`<div style="background:#222;line-height:0"><img src="${e.image}" style="max-width:100%;max-height:70vh;image-rendering:pixelated"></div><div class="row"><button class="btn ghost btn-sm" onclick="anShow(AN.last)">Back</button></div>`,{width:720}); }
function anPng(){ const a=document.createElement("a"); a.href=AN.last.image; a.download=(AN.last.title||"result").replace(/[^\w.-]+/g,"_")+".png"; a.click(); }
function anOverlay(){
  const r=AN.last; I.overlay=r.image; I.legend={legend:r.legend}; winClose(); if(state.view!=="image") state.view="image"; render(); refreshAll();
}
function anSpectraToColl(){
  (AN.last.spectra||[]).forEach(s=>{ if(I.coll.length>=24) return; I.collN++; I.coll.push({key:"an:"+I.collN,color:COLL_COLORS[(I.collN-1)%COLL_COLORS.length],show:true,kind:"px",row:-1,col:-1,n:0,unit:s.unit,wavelengths:I.wl,values:s.values,name:s.name}); });
  winClose(); state.view="image"; render(); refreshAll();
}
function anSpectraSave(){
  const sp=AN.last.spectra; I.coll.length;
  win("Save spectra as library",`<label class="small">Library name</label><input id="cbLib" type="text" value="${escapeHtml(I.active.name)} ${escapeHtml(AN.last.title)}" style="width:100%">
    <div class="row"><div style="flex:1"><label class="small">Category (optional)</label><input id="cbCat" type="text" style="width:100%"></div><div><label class="small">Acquisition</label><select id="cbAcq"><option value="">—</option><option>airborne</option><option>satellite</option><option>field</option><option>lab</option></select></div></div>
    <div class="row"><button class="btn emerald btn-sm" onclick="anSpectraDo()">Save</button><button class="btn ghost btn-sm" onclick="anShow(AN.last)">Back</button></div><div class="err" id="cbErr"></div>`,{width:500});
}
async function anSpectraDo(){
  const lib=document.getElementById("cbLib").value.trim(), cat=document.getElementById("cbCat").value.trim()||null, acq=document.getElementById("cbAcq").value||null;
  try{ const r=await apiSend("POST","/api/spectra/save",{library:lib,items:AN.last.spectra.map(s=>({name:s.name,wavelengths_nm:I.wl,values:s.values,unit:s.unit,category:cat,origin:"image_pixel",acquisition_type:acq}))});
    await loadLibraries(); winClose(); showToast(`Saved ${r.saved} spectra to library "${r.library}"`); }catch(e){ document.getElementById("cbErr").textContent=e.message; }
}

/* Spectral Analyst: rank library spectra by spectral angle against the current pixel / ROI */
function analystOpen(){
  const t=target(), libs=dbLibs();
  if(!t&&!I.coll.length){ showToast("Click a pixel (or draw an ROI) first"); return; }
  win("Spectral Analyst",`<p class="note" style="margin:0 0 6px">Unknown spectrum: ${I.roi.closed?"ROI mean":I.pixel?`pixel (${I.pixel.row}, ${I.pixel.col})`:"collected spectrum"} — compared with every spectrum of the library by spectral angle.</p>
    <div class="row"><label>Library</label><select id="anLib" style="max-width:260px"><option value="">— choose —</option>${libs.map(l=>`<option value="${l.id}">${escapeHtml(l.name)} (${l.spectra})</option>`).join("")}</select></div>
    <div class="row"><label><input id="anIgn" type="checkbox" checked> ignore unit differences (compare shape only)</label></div>
    <div class="row"><button class="btn blue btn-sm" id="anGo" onclick="analystRun()">Run</button><button class="btn ghost btn-sm" onclick="winClose()">Cancel</button></div><div class="err" id="anErr"></div>`,{width:500});
}
async function analystRun(){
  const lib=document.getElementById("anLib").value, err=document.getElementById("anErr"); if(!lib){ err.textContent="Choose a library."; return; }
  let t=target(); if(!t){ const c=I.coll[I.coll.length-1]; t={row:c.row,col:c.col,size:1}; }
  try{
    const r=await apiSend("POST",`/api/images/${I.active.id}/match`,{...t,library_id:lib,ignore_unit:document.getElementById("anIgn").checked,top_k:15});
    await addLibraryToImage(lib);
    const rows=r.results.map((m,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(m.material)}</td><td>${escapeHtml(m.category||"")}</td><td style="text-align:right">${m.angle_deg.toFixed(2)}°</td></tr>`).join("");
    I.matches=r.results; if(r.results.length) I.picked=new Set(r.results.slice(0,3).map(x=>x.spectrum_id));
    win("Spectral Analyst — best matches",`${r.results.length?`<table style="width:100%"><tr><th>#</th><th>Material</th><th>Category</th><th style="text-align:right">Angle</th></tr>${rows}</table>`:`<p class="note">No match.</p>`}${r.note?`<p class="note">${escapeHtml(r.note)}</p>`:""}
      <div class="row"><button class="btn emerald btn-sm" onclick="winClose();state.view='image';render();refreshAll()">Show best 3 in the plot</button><button class="btn ghost btn-sm" onclick="winClose()">Close</button></div>`,{width:560});
  }catch(e){ err.textContent=e.message; }
}

renderMenubar();
</script>
