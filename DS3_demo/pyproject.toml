[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ds3"
version = "0.3.0"
description = "Deep Spectral Signature System (DS3) - Task 1: hyperspectral data aggregation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "rasterio>=1.4",
  "h5py>=3.11",
  "scipy>=1.11",
  "netCDF4>=1.7",
  "zarr>=3.0",
  "numcodecs>=0.13",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
]

[project.optional-dependencies]
field = ["specdal>=0.2"]      # ASD / SED binary readers
gui = ["PySide6>=6.6", "matplotlib>=3.8"]   # DS3 Library desktop app
dev = ["pytest>=8", "httpx>=0.27", "matplotlib>=3.8", "PySide6>=6.6"]
exe = ["pyinstaller>=6.0"]

[project.scripts]
ds3 = "ds3.cli:main"

[project.gui-scripts]
ds3-library = "ds3.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
