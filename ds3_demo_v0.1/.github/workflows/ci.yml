name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e ".[dev]"
      - run: pytest -q
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env: {POSTGRES_USER: ds3, POSTGRES_PASSWORD: ds3, POSTGRES_DB: ds3}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ds3" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ds3:ds3@localhost:5432/ds3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - run: ds3 db init && ds3 sample-data && ds3 ingest data/sample --source ci && ds3 db status
